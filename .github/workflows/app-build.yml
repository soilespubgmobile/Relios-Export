name: Relios Export (uygulama)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ffmpeg-build/ONAYLI_DERLEME'
      - '.github/workflows/app-build.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: .NET 11 SDK (en son kararli)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'ga'

      # Tek exe: 13 videoluk Windows testinden gecmis FFmpeg derlemesi (ffmpeg-build/ONAYLI_DERLEME)
      # programin icine gomulur.
      - name: Onayli FFmpeg derlemesini indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = (Get-Content ffmpeg-build/ONAYLI_DERLEME -Raw).Trim()
          "Onayli FFmpeg derlemesi: run $id"
          gh run download $id -R $env:GITHUB_REPOSITORY -D ffart
          if ($LASTEXITCODE -ne 0) { "HATA: FFmpeg derlemesi indirilemedi (run $id)"; exit 1 }
          $zip = Get-ChildItem -Recurse ffart -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath ffx
          $bin = (Get-ChildItem -Recurse ffx -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory app/ReliosExport/ffmpeg -Force | Out-Null
          Copy-Item "$bin/ffmpeg.exe","$bin/ffprobe.exe" app/ReliosExport/ffmpeg/
          $v = & app/ReliosExport/ffmpeg/ffmpeg.exe -hide_banner -version
          $v | Select-Object -First 1
          Get-ChildItem app/ReliosExport/ffmpeg | ForEach-Object { "{0,-14} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      # WPF'in DirectWriteForwarder.dll'i C++/CLI: paketin icinden yuklenemez, diske acilmasi gerekir.
      # IncludeAllContentForSelfExtract ffmpeg.exe ve ffprobe.exe'yi de ilk acilista ayni yere acar.
      - name: Derle (tek exe, self-contained, FFmpeg icinde)
        run: >
          dotnet publish app/ReliosExport/ReliosExport.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - name: Tek exe kontrolu
        run: |
          Get-ChildItem out | ForEach-Object { "{0,-24} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          $diger = Get-ChildItem out | Where-Object { $_.Name -notin @('Relios Export.exe', 'Relios Export.pdb') }
          if ($diger) { "HATA: exe disinda dosya kaldi: $($diger.Name -join ', ')"; exit 1 }
          $exe = Get-Item "out/Relios Export.exe"
          if ($exe.Length -lt 70MB) { "HATA: exe cok kucuk, FFmpeg gomulmemis olabilir"; exit 1 }
          "Tek exe hazir: $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Tek exe kontrolu (FFmpeg aciliyor mu, pencere hatasiz aciliyor mu)
        run: |
          function Kontrol($arg, $out, $ek = @()) {
            $p = Start-Process -FilePath "out/Relios Export.exe" -ArgumentList (@($arg, $out) + $ek) -PassThru
            $null = $p.Handle  # cikis kodunun okunabilmesi icin
            if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "HATA: program 3 dakikada kapanmadi ($arg)"; return 1 }
            if (Test-Path $out) { Get-Content $out | ForEach-Object { Write-Host $_ } }
            if (Test-Path "out/Relios Export hata.txt") {
              Write-Host "--- hata kaydi"
              Get-Content "out/Relios Export hata.txt" | ForEach-Object { Write-Host $_ }
            }
            return $p.ExitCode
          }
          $f = Join-Path $PWD "ffmpeg-kontrol.txt"
          $rc = Kontrol '--ffmpeg-kontrol' $f
          if ($rc -ne 0) { "HATA: program icindeki FFmpeg bulunamadi (kod $rc)"; exit 1 }
          $ff = ((Get-Content $f) | Where-Object { $_ -like 'ffmpeg=*' }) -replace '^ffmpeg=', ''
          $v = & $ff -hide_banner -version
          if ($LASTEXITCODE -ne 0) { "HATA: acilan ffmpeg.exe calismadi"; exit 1 }
          $v | Select-Object -First 1
          $rc = Kontrol '--pencere-kontrol' (Join-Path $PWD "pencere-kontrol.txt") @('--ekran', (Join-Path $PWD 'ekran'))
          if ($rc -ne 0) { "HATA: pencereler acilamadi (kod $rc)"; exit 1 }
          "Tek exe calisiyor: FFmpeg icinde, ana pencere ve ayar pencereleri hatasiz aciliyor."

      # Programi bir kullanici gibi kullanir: video ekler, Baslat, bitir, yalnizca hataliyi yeniden dener, cikarir,
      # Tekrar isle (LUFS esitleme acik), iptal, TikTok'a gecer (NVENC yok: anlasilir hata + gunluk), temizler.
      # Her adimda satirlari, durum yazisini, dugmeleri ve olusan dosyalari (ffprobe) denetler.
      - name: Uctan uca deneme (arayuz bir kullanici gibi)
        run: |
          $ff = (Resolve-Path app/ReliosExport/ffmpeg/ffmpeg.exe).Path
          $m = Join-Path $PWD 'medya'
          New-Item -ItemType Directory $m -Force | Out-Null
          # ses_var: 12 sn 720p, kisik ve yavas inip cikan ses (AAC) -> esitlemede dogrusal, -14'e yukselir.
          $deg = '(0.03+0.015*sin(2*PI*0.1*t))'
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i "aevalsrc=$deg*sin(2*PI*440*t)|$deg*sin(2*PI*550*t):s=48000" -t 12 -pix_fmt yuv420p -c:v libx264 -preset veryfast -c:a aac -b:a 192k -y "$m/ses_var.mp4"
          # sessiz: ses izi yok. harici: ses izi yok ama yaninda ayni adli WAV (mono, yuksek ses).
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=25 -t 3 -pix_fmt yuv420p -c:v libx264 -preset veryfast -an -y "$m/sessiz.mov"
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -t 4 -pix_fmt yuv420p -c:v libx264 -preset veryfast -an -y "$m/harici.mp4"
          & $ff -hide_banner -loglevel error -f lavfi -i "aevalsrc=0.5*sin(2*PI*1000*t):s=48000:d=4" -c:a pcm_s16le -y "$m/harici.wav"
          & $ff -hide_banner -loglevel error -f lavfi -i "aevalsrc=0.2*sin(2*PI*500*t):s=48000:d=1" -c:a pcm_s16le -y "$m/yalniz.wav"
          # Turkce karakterli, bosluklu ve parantezli ad: videonun sesi yok, yaninda ayni adli kisik stereo WAV.
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=size=1080x1920:rate=30 -t 12 -pix_fmt yuv420p -c:v libx264 -preset veryfast -an -y "$m/Türkçe ğüşıöç İsim (1).mp4"
          & $ff -hide_banner -loglevel error -f lavfi -i "aevalsrc=$deg*sin(2*PI*440*t)|$deg*sin(2*PI*550*t):s=48000:d=12" -c:a pcm_s24le -y "$m/Türkçe ğüşıöç İsim (1).wav"
          # uzun: 40 sn 1080p gurultulu goruntu (x264'u yavaslatir) -> iptal denemesi.
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30 -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 40 -vf "noise=alls=40:allf=t" -pix_fmt yuv420p -c:v libx264 -preset ultrafast -crf 28 -c:a aac -y "$m/uzun.mp4"
          Set-Content "$m/bozuk.mp4" ("bu bir video degil " * 2000)
          Set-Content "$m/notlar.txt" "video degil"
          Get-ChildItem $m | ForEach-Object { "{0,-14} {1,10:N0} bayt" -f $_.Name, $_.Length }
          $eksik = @('ses_var.mp4', 'sessiz.mov', 'harici.mp4', 'harici.wav', 'yalniz.wav', 'uzun.mp4', 'bozuk.mp4', 'notlar.txt', 'Türkçe ğüşıöç İsim (1).mp4', 'Türkçe ğüşıöç İsim (1).wav') |
            Where-Object { -not (Test-Path (Join-Path $m $_)) -or (Get-Item (Join-Path $m $_)).Length -eq 0 }
          if ($eksik) { "HATA: deneme videosu uretilemedi: $($eksik -join ', ')"; exit 1 }

          # Onceki adimin (pencere kontrolu) ayarlari silinir: deneme fabrika ayarlariyla baslar.
          Remove-Item "out/ayarlar.json" -ErrorAction SilentlyContinue
          $rapor = Join-Path $PWD 'uctan-uca.txt'
          $cikti = Join-Path $PWD 'uctan-uca-cikti'
          $p = Start-Process -FilePath "out/Relios Export.exe" -ArgumentList @('--uctan-uca', $rapor, '--medya', $m, '--cikti', $cikti) -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(1200000)) { $p.Kill(); "HATA: uctan uca deneme 20 dakikada bitmedi" }
          if (Test-Path $rapor) { Get-Content $rapor | ForEach-Object { Write-Host $_ } } else { "HATA: rapor yazilmadi" }
          if (Test-Path "out/Relios Export hata.txt") { "--- hata kaydi"; Get-Content "out/Relios Export hata.txt" }
          "--- kayit yeri"
          if (Test-Path $cikti) { Get-ChildItem $cikti | ForEach-Object { "{0,-28} {1,12:N0} bayt" -f $_.Name, $_.Length } }
          if ($p.ExitCode -ne 0) { "HATA: uctan uca denemede fark var (kod $($p.ExitCode))"; exit 1 }
          "Uctan uca deneme: hepsi OK."

      # Arayuzun goruntuleri (ana pencere, ayar paneli, x264 / NVENC / FDK / on ayar pencerelerinin her sekmesi).
      # Gunlukte base64 olarak durur; gozle kontrol icin.
      - name: Ekran goruntuleri
        if: always()
        run: |
          if (-not (Test-Path ekran)) { "Ekran goruntusu yok."; exit 0 }
          Get-ChildItem ekran -Filter *.png | Sort-Object Name | ForEach-Object {
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            Write-Host ("EKRAN-BASLA|{0}|{1}" -f $_.Name, $_.Length)
            for ($i = 0; $i -lt $b.Length; $i += 3000) {
              Write-Host ("EKRAN|{0}|{1}" -f $_.Name, $b.Substring($i, [Math]::Min(3000, $b.Length - $i)))
            }
          }

      - name: Ciktiyi yukle
        uses: actions/upload-artifact@v7
        with:
          name: relios-export-win64
          path: out/Relios Export.exe
          retention-days: 30
