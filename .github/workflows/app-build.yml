name: Relios Export (uygulama)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ffmpeg-build/ONAYLI_DERLEME'
      - '.github/workflows/app-build.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: .NET 11 SDK (en son kararli)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'ga'

      # Tek exe: 13 videoluk Windows testinden gecmis FFmpeg derlemesi (ffmpeg-build/ONAYLI_DERLEME)
      # programin icine gomulur.
      - name: Onayli FFmpeg derlemesini indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = (Get-Content ffmpeg-build/ONAYLI_DERLEME -Raw).Trim()
          "Onayli FFmpeg derlemesi: run $id"
          gh run download $id -R $env:GITHUB_REPOSITORY -D ffart
          if ($LASTEXITCODE -ne 0) { "HATA: FFmpeg derlemesi indirilemedi (run $id)"; exit 1 }
          $zip = Get-ChildItem -Recurse ffart -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath ffx
          $bin = (Get-ChildItem -Recurse ffx -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory app/ReliosExport/ffmpeg -Force | Out-Null
          Copy-Item "$bin/ffmpeg.exe","$bin/ffprobe.exe" app/ReliosExport/ffmpeg/
          $v = & app/ReliosExport/ffmpeg/ffmpeg.exe -hide_banner -version
          $v | Select-Object -First 1
          Get-ChildItem app/ReliosExport/ffmpeg | ForEach-Object { "{0,-14} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          # Programin icine yalnizca onayli dosyalar gomulur: SHA-256'lari depodaki kayitla (ffmpeg-build/ONAYLI_SHA256)
          # ayni olmali (indirilen derleme hangi calismadan gelirse gelsin).
          $dogrulanan = 0
          foreach ($satir in Get-Content ffmpeg-build/ONAYLI_SHA256) {
            if ($satir -notmatch '^([0-9a-f]{64})\s+(\S+)$') { continue }
            $beklenen = $Matches[1]; $ad = $Matches[2]
            $gercek = (Get-FileHash -LiteralPath "app/ReliosExport/ffmpeg/$ad" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($gercek -ne $beklenen) { "HATA: $ad onayli derlemedeki dosya degil: sha256 $gercek (beklenen $beklenen)"; exit 1 }
            "sha256 $gercek  $ad  (onayli kayitla ayni)"
            $dogrulanan++
          }
          if ($dogrulanan -ne 2) { "HATA: ffmpeg-build/ONAYLI_SHA256 icinde iki dosya bekleniyordu (dogrulanan: $dogrulanan)"; exit 1 }

      # WPF'in DirectWriteForwarder.dll'i C++/CLI: paketin icinden yuklenemez, diske acilmasi gerekir.
      # IncludeAllContentForSelfExtract ffmpeg.exe ve ffprobe.exe'yi de ilk acilista ayni yere acar.
      - name: Derle (tek exe, self-contained, FFmpeg icinde)
        run: >
          dotnet publish app/ReliosExport/ReliosExport.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - name: Tek exe kontrolu
        run: |
          Get-ChildItem out | ForEach-Object { "{0,-24} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          $diger = Get-ChildItem out | Where-Object { $_.Name -notin @('Relios Export.exe', 'Relios Export.pdb') }
          if ($diger) { "HATA: exe disinda dosya kaldi: $($diger.Name -join ', ')"; exit 1 }
          $exe = Get-Item "out/Relios Export.exe"
          if ($exe.Length -lt 70MB) { "HATA: exe cok kucuk, FFmpeg gomulmemis olabilir"; exit 1 }
          "Tek exe hazir: $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Tek exe kontrolu (FFmpeg aciliyor mu, pencere hatasiz aciliyor mu)
        run: |
          function Kontrol($arg, $out, $ek = @()) {
            $p = Start-Process -FilePath "out/Relios Export.exe" -ArgumentList (@($arg, $out) + $ek) -PassThru
            $null = $p.Handle  # cikis kodunun okunabilmesi icin
            if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "HATA: program 3 dakikada kapanmadi ($arg)"; return 1 }
            if (Test-Path $out) { Get-Content $out | ForEach-Object { Write-Host $_ } }
            if (Test-Path "out/Relios Export hata.txt") {
              Write-Host "--- hata kaydi"
              Get-Content "out/Relios Export hata.txt" | ForEach-Object { Write-Host $_ }
            }
            return $p.ExitCode
          }
          $f = Join-Path $PWD "ffmpeg-kontrol.txt"
          $rc = Kontrol '--ffmpeg-kontrol' $f
          if ($rc -ne 0) { "HATA: program icindeki FFmpeg bulunamadi (kod $rc)"; exit 1 }
          $ff = ((Get-Content $f) | Where-Object { $_ -like 'ffmpeg=*' }) -replace '^ffmpeg=', ''
          $v = & $ff -hide_banner -version
          if ($LASTEXITCODE -ne 0) { "HATA: acilan ffmpeg.exe calismadi"; exit 1 }
          $v | Select-Object -First 1
          $rc = Kontrol '--pencere-kontrol' (Join-Path $PWD "pencere-kontrol.txt") @('--ekran', (Join-Path $PWD 'ekran'))
          if ($rc -ne 0) { "HATA: pencereler acilamadi (kod $rc)"; exit 1 }
          "Tek exe calisiyor: FFmpeg icinde, ana pencere ve ayar pencereleri hatasiz aciliyor."

      # 0.16.1: ayni exe ikinci kez acilinca yeni pencere acilmaz; acik olan one gelir (simge durumundaysa geri acilir),
      # ikinci kopya pencere acmadan kapanir. Program kapaninca (ve kapatilip hemen acilinca) yeniden acilir. Derleme
      # denetimleri (--ffmpeg-kontrol ...) program acikken de calisir.
      - name: Tek kopya denemesi (ayni exe ikinci kez acilmaz, acik olan one gelir)
        run: |
          Add-Type -Namespace Win -Name U32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr hWnd, int nCmdShow); [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr hWnd); [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();'
          $exe = (Resolve-Path "out/Relios Export.exe").Path
          Remove-Item "out/ayarlar.json" -ErrorAction SilentlyContinue
          Remove-Item "out/Relios Export hata.txt" -ErrorAction SilentlyContinue
          $sorun = @()
          function Pencere($p, $sn) {
            for ($i = 0; $i -lt $sn * 4; $i++) {
              try {
                if ($p.HasExited) { return $false }
                $p.Refresh()
                if ($p.MainWindowHandle -ne [IntPtr]::Zero) { return $true }
              } catch { return $false }
              Start-Sleep -Milliseconds 250
            }
            return $false
          }
          function Kopyalar { return @(Get-Process -Name 'Relios Export' -ErrorAction SilentlyContinue).Count }
          function Ac($ek = @()) {
            $p = if ($ek.Count) { Start-Process -FilePath $exe -ArgumentList $ek -PassThru } else { Start-Process -FilePath $exe -PassThru }
            $null = $p.Handle  # cikis kodunun okunabilmesi icin
            return $p
          }
          function Oldur { Get-Process -Name 'Relios Export' -ErrorAction SilentlyContinue | ForEach-Object { try { $_.Kill() } catch { } } }

          if ((Kopyalar) -ne 0) { "HATA: deneme baslamadan acik kopya var ($(Kopyalar))"; Oldur; exit 1 }

          # 1) Ilk kopya acilir.
          $p1 = Ac
          if (-not (Pencere $p1 90)) { "HATA: ilk kopyanin penceresi 90 saniyede acilmadi"; Oldur; exit 1 }
          $h1 = $p1.MainWindowHandle
          "1. kopya acildi: islem $($p1.Id), pencere $h1"
          Start-Sleep -Seconds 2

          # 2) Ikinci acilis: pencere acmadan kapanir (kod 0); ilk kopya acik kalir, baska kopya yok.
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p2 = Ac
          if (-not $p2.WaitForExit(30000)) { $sorun += 'ikinci acilis 30 saniyede kapanmadi (yeni pencere acildi)' }
          else {
            "2. acilis $($sw.ElapsedMilliseconds) ms'de kapandi (kod $($p2.ExitCode))"
            if ($p2.ExitCode -ne 0) { $sorun += "ikinci acilisin cikis kodu $($p2.ExitCode)" }
          }
          $p1.Refresh()
          if ($p1.HasExited) { $sorun += 'ikinci acilistan sonra ilk kopya kapandi' }
          if ((Kopyalar) -ne 1) { $sorun += "ikinci acilistan sonra acik kopya sayisi $(Kopyalar) (1 olmali)" }

          # 3) Pes pese uc acilis: hicbiri pencere acmaz.
          $uc = @(1..3 | ForEach-Object { Ac })
          foreach ($p in $uc) { if (-not $p.WaitForExit(30000)) { $sorun += 'pes pese acilislardan biri kapanmadi (yeni pencere acildi)' } elseif ($p.ExitCode -ne 0) { $sorun += "pes pese acilisin cikis kodu $($p.ExitCode)" } }
          if ((Kopyalar) -ne 1) { $sorun += "pes pese acilislardan sonra acik kopya sayisi $(Kopyalar) (1 olmali)" } else { 'Pes pese uc acilis: hicbiri pencere acmadi.' }

          # 4) Pencere simge durumundayken acilis: pencere geri acilir.
          if (-not $p1.HasExited) {
            $null = [Win.U32]::ShowWindowAsync($h1, 6)  # SW_MINIMIZE
            Start-Sleep -Seconds 2
            $kucuk = [Win.U32]::IsIconic($h1)
            $p3 = Ac
            if (-not $p3.WaitForExit(30000)) { $sorun += 'simge durumundayken acilis kapanmadi (yeni pencere acildi)' }
            Start-Sleep -Seconds 1
            if (-not $kucuk) { 'NOT: pencere simge durumuna alinamadi (deneme ortami); geri acilma denenemedi.' }
            elseif ([Win.U32]::IsIconic($h1)) { $sorun += 'simge durumundaki pencere geri acilmadi' }
            else { 'Simge durumundaki pencere geri acildi.' }
            "On plandaki pencere: $([Win.U32]::GetForegroundWindow()) (programin penceresi: $h1)"
          }

          # 5) Program acikken derleme denetimi (--ffmpeg-kontrol) yine calisir (tek kopya denetimine girmez).
          $f = Join-Path $PWD 'tek-kopya-ffmpeg.txt'
          Remove-Item $f -ErrorAction SilentlyContinue
          $p4 = Ac @('--ffmpeg-kontrol', $f)
          if (-not $p4.WaitForExit(120000)) { $sorun += 'program acikken --ffmpeg-kontrol kapanmadi' }
          elseif ($p4.ExitCode -ne 0 -or -not (Test-Path $f)) { $sorun += "program acikken --ffmpeg-kontrol calismadi (kod $($p4.ExitCode))" }
          else { 'Program acikken --ffmpeg-kontrol calisti.' }

          # 6) Ilk kopya kapatilir (pencereyi kapat): kapanir, kod 0.
          if (-not $p1.HasExited) {
            $null = $p1.CloseMainWindow()
            if (-not $p1.WaitForExit(30000)) { $sorun += 'ilk kopya kapatilinca 30 saniyede kapanmadi' }
            else { "1. kopya kapandi (kod $($p1.ExitCode))"; if ($p1.ExitCode -ne 0) { $sorun += "ilk kopyanin cikis kodu $($p1.ExitCode)" } }
          }

          # 7) Kapandiktan sonra yeniden acilir; kapatilip hemen acilinca da acilir (kapanan kopya yanit vermez, yenisi
          #    kilit bosalinca acilir).
          Oldur
          Start-Sleep -Seconds 1
          $p5 = Ac
          if (-not (Pencere $p5 90)) { $sorun += 'kapandiktan sonra program yeniden acilmadi' }
          else {
            'Kapandiktan sonra yeniden acildi.'
            $null = $p5.CloseMainWindow()
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p6 = Ac
            if (-not (Pencere $p6 90)) { $sorun += 'kapatilip hemen acilinca program acilmadi' }
            else {
              "Kapatilip hemen acilinca $($sw.ElapsedMilliseconds) ms'de acildi."
              if (-not $p5.WaitForExit(30000)) { $sorun += 'kapatilan kopya 30 saniyede kapanmadi' }
              if ((Kopyalar) -ne 1) { $sorun += "kapatilip acildiktan sonra acik kopya sayisi $(Kopyalar) (1 olmali)" }
              $null = $p6.CloseMainWindow()
              if (-not $p6.WaitForExit(30000)) { $sorun += 'son kopya kapatilinca 30 saniyede kapanmadi' }
            }
          }
          Oldur
          if (Test-Path "out/Relios Export hata.txt") { "--- hata kaydi"; Get-Content "out/Relios Export hata.txt"; $sorun += 'hata kaydi olustu' }
          Remove-Item "out/ayarlar.json" -ErrorAction SilentlyContinue
          if ($sorun) { "HATA: tek kopya denemesinde sorun var:"; $sorun | ForEach-Object { " - $_" }; exit 1 }
          "Tek kopya: ikinci acilis pencere acmadi, acik kopya yanit verdi; kapaninca yeniden acildi."

      # Programi bir kullanici gibi kullanir: video ekler, Baslat, bitir, yalnizca hataliyi yeniden dener, cikarir,
      # Tekrar isle (LUFS esitleme acik), iptal, TikTok'a gecer (NVENC yok: anlasilir hata + gunluk), temizler.
      # Her adimda satirlari, durum yazisini, dugmeleri ve olusan dosyalari (ffprobe) denetler.
      - name: Uctan uca deneme (arayuz bir kullanici gibi)
        run: |
          $ff = (Resolve-Path app/ReliosExport/ffmpeg/ffmpeg.exe).Path
          $m = Join-Path $PWD 'medya'
          New-Item -ItemType Directory $m -Force | Out-Null
          # ses_var: 12 sn 720p, kisik ve yavas inip cikan ses (AAC) -> esitlemede dogrusal, -14'e yukselir.
          $deg = '(0.03+0.015*sin(2*PI*0.1*t))'
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i "aevalsrc=$deg*sin(2*PI*440*t)|$deg*sin(2*PI*550*t):s=48000" -t 12 -pix_fmt yuv420p -c:v libx264 -preset veryfast -c:a aac -b:a 192k -y "$m/ses_var.mp4"
          # sessiz: ses izi yok. harici: ses izi yok ama yaninda ayni adli WAV (mono, yuksek ses).
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=25 -t 3 -pix_fmt yuv420p -c:v libx264 -preset veryfast -an -y "$m/sessiz.mov"
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -t 4 -pix_fmt yuv420p -c:v libx264 -preset veryfast -an -y "$m/harici.mp4"
          & $ff -hide_banner -loglevel error -f lavfi -i "aevalsrc=0.5*sin(2*PI*1000*t):s=48000:d=4" -c:a pcm_s16le -y "$m/harici.wav"
          & $ff -hide_banner -loglevel error -f lavfi -i "aevalsrc=0.2*sin(2*PI*500*t):s=48000:d=1" -c:a pcm_s16le -y "$m/yalniz.wav"
          # Turkce karakterli, bosluklu ve parantezli ad: videonun sesi yok, yaninda ayni adli kisik stereo WAV.
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=size=1080x1920:rate=30 -t 12 -pix_fmt yuv420p -c:v libx264 -preset veryfast -an -y "$m/Türkçe ğüşıöç İsim (1).mp4"
          & $ff -hide_banner -loglevel error -f lavfi -i "aevalsrc=$deg*sin(2*PI*440*t)|$deg*sin(2*PI*550*t):s=48000:d=12" -c:a pcm_s24le -y "$m/Türkçe ğüşıöç İsim (1).wav"
          # uzun: 40 sn 1080p gurultulu goruntu (x264'u yavaslatir) -> iptal denemesi.
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30 -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 40 -vf "noise=alls=40:allf=t" -pix_fmt yuv420p -c:v libx264 -preset ultrafast -crf 28 -c:a aac -y "$m/uzun.mp4"
          Set-Content "$m/bozuk.mp4" ("bu bir video degil " * 2000)
          Set-Content "$m/notlar.txt" "video degil"
          Get-ChildItem $m | ForEach-Object { "{0,-14} {1,10:N0} bayt" -f $_.Name, $_.Length }
          $eksik = @('ses_var.mp4', 'sessiz.mov', 'harici.mp4', 'harici.wav', 'yalniz.wav', 'uzun.mp4', 'bozuk.mp4', 'notlar.txt', 'Türkçe ğüşıöç İsim (1).mp4', 'Türkçe ğüşıöç İsim (1).wav') |
            Where-Object { -not (Test-Path (Join-Path $m $_)) -or (Get-Item (Join-Path $m $_)).Length -eq 0 }
          if ($eksik) { "HATA: deneme videosu uretilemedi: $($eksik -join ', ')"; exit 1 }

          # Onceki adimin (pencere kontrolu) ayarlari silinir: deneme fabrika ayarlariyla baslar.
          Remove-Item "out/ayarlar.json" -ErrorAction SilentlyContinue
          $rapor = Join-Path $PWD 'uctan-uca.txt'
          $cikti = Join-Path $PWD 'uctan-uca-cikti'
          $p = Start-Process -FilePath "out/Relios Export.exe" -ArgumentList @('--uctan-uca', $rapor, '--medya', $m, '--cikti', $cikti) -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(1200000)) { $p.Kill(); "HATA: uctan uca deneme 20 dakikada bitmedi" }
          if (Test-Path $rapor) { Get-Content $rapor | ForEach-Object { Write-Host $_ } } else { "HATA: rapor yazilmadi" }
          if (Test-Path "out/Relios Export hata.txt") { "--- hata kaydi"; Get-Content "out/Relios Export hata.txt" }
          "--- kayit yeri"
          if (Test-Path $cikti) { Get-ChildItem $cikti | ForEach-Object { "{0,-28} {1,12:N0} bayt" -f $_.Name, $_.Length } }
          if ($p.ExitCode -ne 0) { "HATA: uctan uca denemede fark var (kod $($p.ExitCode))"; exit 1 }
          "Uctan uca deneme: hepsi OK."

      # Arayuzdeki her kutu, acilir liste, onay kutusu ve dugme tek tek denenir (ana panel ve x264 / NVENC / FDK AAC /
      # on ayar pencereleri): ayar degisiyor mu, komuta yansiyor mu, FFmpeg'de calisiyor mu (kucuk deneme videosuyla),
      # uc degerler, hatali yazim, bos kutu, Enter / Esc, Vazgec / Tamam, Varsayilan, on ayar, baglama hatasi.
      - name: Arayuz taramasi (her kutu, liste ve dugme)
        if: ${{ !cancelled() }}
        run: |
          $ff = (Resolve-Path app/ReliosExport/ffmpeg/ffmpeg.exe).Path
          $m = Join-Path $PWD 'medya-tarama'
          New-Item -ItemType Directory $m -Force | Out-Null
          # minik: 1 sn 320x180 30 fps, stereo ses; yaninda ayni adli WAV (ses kaynagi secenekleri farkli komut versin).
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=30 -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 1 -pix_fmt yuv420p -c:v libx264 -preset veryfast -c:a aac -ac 2 -y "$m/minik.mp4"
          & $ff -hide_banner -loglevel error -f lavfi -i "aevalsrc=0.3*sin(2*PI*660*t)|0.3*sin(2*PI*880*t):s=48000:d=1" -c:a pcm_s16le -y "$m/minik.wav"
          if (-not (Test-Path "$m/minik.mp4") -or -not (Test-Path "$m/minik.wav")) { "HATA: deneme videosu uretilemedi"; exit 1 }
          Remove-Item "out/ayarlar.json" -ErrorAction SilentlyContinue
          Remove-Item "out/Relios Export hata.txt" -ErrorAction SilentlyContinue
          $rapor = Join-Path $PWD 'arayuz-taramasi.txt'
          $cikti = Join-Path $PWD 'arayuz-taramasi-cikti'
          $p = Start-Process -FilePath "out/Relios Export.exe" -ArgumentList @('--arayuz-taramasi', $rapor, '--medya', $m, '--cikti', $cikti) -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(2400000)) { $p.Kill(); "HATA: arayuz taramasi 40 dakikada bitmedi" }
          if (Test-Path $rapor) { Get-Content $rapor | ForEach-Object { Write-Host $_ } } else { "HATA: rapor yazilmadi" }
          if (Test-Path "out/Relios Export hata.txt") { "--- hata kaydi"; Get-Content "out/Relios Export hata.txt" }
          if ($p.ExitCode -ne 0) { "HATA: arayuz taramasinda fark var (kod $($p.ExitCode))"; exit 1 }
          "Arayuz taramasi: hepsi OK."

      # Arayuzun goruntuleri (ana pencere, ayar paneli, x264 / NVENC / FDK / on ayar pencerelerinin her sekmesi).
      # Gunlukte base64 olarak durur; gozle kontrol icin.
      - name: Ekran goruntuleri
        if: always()
        run: |
          if (-not (Test-Path ekran)) { "Ekran goruntusu yok."; exit 0 }
          Get-ChildItem ekran -Filter *.png | Sort-Object Name | ForEach-Object {
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            Write-Host ("EKRAN-BASLA|{0}|{1}" -f $_.Name, $_.Length)
            for ($i = 0; $i -lt $b.Length; $i += 3000) {
              Write-Host ("EKRAN|{0}|{1}" -f $_.Name, $b.Substring($i, [Math]::Min(3000, $b.Length - $i)))
            }
          }

      - name: Ciktiyi yukle
        uses: actions/upload-artifact@v7
        with:
          name: relios-export-win64
          path: out/Relios Export.exe
          retention-days: 30
