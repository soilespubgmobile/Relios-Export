name: Relios Export (uygulama)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ffmpeg-build/ONAYLI_DERLEME'
      - '.github/workflows/app-build.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: .NET 11 SDK (en son kararli)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'ga'

      # Tek exe: 13 videoluk Windows testinden gecmis FFmpeg derlemesi (ffmpeg-build/ONAYLI_DERLEME)
      # programin icine gomulur.
      - name: Onayli FFmpeg derlemesini indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = (Get-Content ffmpeg-build/ONAYLI_DERLEME -Raw).Trim()
          "Onayli FFmpeg derlemesi: run $id"
          gh run download $id -R $env:GITHUB_REPOSITORY -D ffart
          if ($LASTEXITCODE -ne 0) { "HATA: FFmpeg derlemesi indirilemedi (run $id)"; exit 1 }
          $zip = Get-ChildItem -Recurse ffart -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath ffx
          $bin = (Get-ChildItem -Recurse ffx -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory app/ReliosExport/ffmpeg -Force | Out-Null
          Copy-Item "$bin/ffmpeg.exe","$bin/ffprobe.exe" app/ReliosExport/ffmpeg/
          $v = & app/ReliosExport/ffmpeg/ffmpeg.exe -hide_banner -version
          $v | Select-Object -First 1
          Get-ChildItem app/ReliosExport/ffmpeg | ForEach-Object { "{0,-14} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      # WPF'in DirectWriteForwarder.dll'i C++/CLI: paketin icinden yuklenemez, diske acilmasi gerekir.
      # IncludeAllContentForSelfExtract ffmpeg.exe ve ffprobe.exe'yi de ilk acilista ayni yere acar.
      - name: Derle (tek exe, self-contained, FFmpeg icinde)
        run: >
          dotnet publish app/ReliosExport/ReliosExport.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - name: Tek exe kontrolu
        run: |
          Get-ChildItem out | ForEach-Object { "{0,-24} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          $diger = Get-ChildItem out | Where-Object { $_.Name -notin @('Relios Export.exe', 'Relios Export.pdb') }
          if ($diger) { "HATA: exe disinda dosya kaldi: $($diger.Name -join ', ')"; exit 1 }
          $exe = Get-Item "out/Relios Export.exe"
          if ($exe.Length -lt 70MB) { "HATA: exe cok kucuk, FFmpeg gomulmemis olabilir"; exit 1 }
          "Tek exe hazir: $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Tek exe kontrolu (FFmpeg aciliyor mu, pencere hatasiz aciliyor mu)
        run: |
          function Kontrol($arg, $out, $ek = @()) {
            $p = Start-Process -FilePath "out/Relios Export.exe" -ArgumentList (@($arg, $out) + $ek) -PassThru
            $null = $p.Handle  # cikis kodunun okunabilmesi icin
            if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "HATA: program 3 dakikada kapanmadi ($arg)"; return 1 }
            if (Test-Path $out) { Get-Content $out | ForEach-Object { Write-Host $_ } }
            if (Test-Path "out/Relios Export hata.txt") {
              Write-Host "--- hata kaydi"
              Get-Content "out/Relios Export hata.txt" | ForEach-Object { Write-Host $_ }
            }
            return $p.ExitCode
          }
          $f = Join-Path $PWD "ffmpeg-kontrol.txt"
          $rc = Kontrol '--ffmpeg-kontrol' $f
          if ($rc -ne 0) { "HATA: program icindeki FFmpeg bulunamadi (kod $rc)"; exit 1 }
          $ff = ((Get-Content $f) | Where-Object { $_ -like 'ffmpeg=*' }) -replace '^ffmpeg=', ''
          $v = & $ff -hide_banner -version
          if ($LASTEXITCODE -ne 0) { "HATA: acilan ffmpeg.exe calismadi"; exit 1 }
          $v | Select-Object -First 1
          # Kirpma onizlemesi icin gercek bir video (yatay 1920x1080: 9:16'ya yanlardan kirpilir)
          $ornek = Join-Path $PWD 'ornek-yatay.mp4'
          & $ff -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=1920x1080:rate=30:duration=3 -c:v libx264 -preset veryfast -pix_fmt yuv420p $ornek
          if ($LASTEXITCODE -ne 0) { "HATA: ornek video uretilemedi"; exit 1 }
          $rc = Kontrol '--pencere-kontrol' (Join-Path $PWD "pencere-kontrol.txt") @('--ekran', (Join-Path $PWD 'ekran'), '--ornek-video', $ornek)
          if ($rc -ne 0) { "HATA: pencereler acilamadi (kod $rc)"; exit 1 }
          "Tek exe calisiyor: FFmpeg icinde, ana pencere ve ayar pencereleri hatasiz aciliyor."

      # Arayuzun goruntuleri (ana pencere, ayar paneli, x264 / NVENC / FDK / on ayar pencerelerinin her sekmesi).
      # Gunlukte base64 olarak durur; gozle kontrol icin.
      - name: Ekran goruntuleri
        if: always()
        run: |
          if (-not (Test-Path ekran)) { "Ekran goruntusu yok."; exit 0 }
          Get-ChildItem ekran -Filter *.png | Sort-Object Name | ForEach-Object {
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            Write-Host ("EKRAN-BASLA|{0}|{1}" -f $_.Name, $_.Length)
            for ($i = 0; $i -lt $b.Length; $i += 3000) {
              Write-Host ("EKRAN|{0}|{1}" -f $_.Name, $b.Substring($i, [Math]::Min(3000, $b.Length - $i)))
            }
          }

      - name: Ciktiyi yukle
        uses: actions/upload-artifact@v7
        with:
          name: relios-export-win64
          path: out/Relios Export.exe
          retention-days: 30
