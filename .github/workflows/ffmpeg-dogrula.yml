name: FFmpeg dogrulama (Windows)

# FFmpeg derlemesi bitince kendiliginden calisir (ya da elle, run numarasiyla):
# 1) Linux'ta ozellikleri bilinen 15 deneme videosu uretilir (farkli bicim, boyut, kare hizi,
#    ses, dondurme bilgisi, renk araligi, HDR, Turkce dosya adi, yaninda ayni adli WAV...).
# 2) Windows'ta derlenen ffmpeg.exe ile programin kendi kodu (dikey 9:16 hedef ayari) her birini cevirir.
#    Her cikti hedef meta veriyle (tools/hedef_kontrol.py) ve kaynakla
#    (tools/saglamlik_kontrol.py: sure, kare sayisi, senkron, dondurme, renk, kirpma) karsilastirilir.
#    Programin urettigi komut, XviD4PSP ile dogrulanan 0.3.0'in komutuyla harf harf karsilastirilir.
# 3) Diger ayarlar da denenir: YouTube ve TikTok varsayilani (x264 veryslow CRF 24, 16 referans kare, anahtar kare
#    en cok 10 sn; FDK AAC 128 kb/s 44,1 kHz), 2 / 3 gecisli x264, WAV sesli MOV, siyah kenar, sessiz, ses seviyesi /
#    gecikme, HE-AAC, NVENC komutu (0.10.0'in TikTok varsayilani; tools/ayar_kontrol.py).
# 4) Ses donusumu: WAV 16 bit 48 kHz secilince 24 bit kaynak ucgen titresimle 16 bit'e inmeli, 16 bit 48 kHz
#    kaynagin sesine hic dokunulmamali (tools/ses_donusum_kontrol.py). YouTube sesi FDK AAC 128 kb/s 48 kHz, TikTok
#    sesi FDK AAC 128 kb/s 44,1 kHz (ayni donusum zinciri).
# 5) Ses yuksekligi: sinirlayici ve LUFS esitleme; cikti BS.1770 olceriyle (ebur128) olculur, hedef -14 +- 0,1.
on:
  workflow_run:
    workflows: ["Relios FFmpeg (win64, nonfree, en son kararli surumler)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Dogrulanacak FFmpeg derlemesinin run numarasi"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  kaynaklar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ffmpeg kur (yalnizca deneme videolarini uretmek icin)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -hide_banner -version | head -1

      - name: Deneme videolarini uret
        run: bash tools/test_kaynaklari.sh kaynaklar

      - name: Deneme videolarini yukle
        uses: actions/upload-artifact@v7
        with:
          name: deneme-videolari
          path: kaynaklar
          retention-days: 3

  dogrula:
    needs: kaynaklar
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: .NET 11 SDK (en son kararli)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'ga'

      - name: FFmpeg derlemesini indir
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: art

      - name: Deneme videolarini indir
        uses: actions/download-artifact@v8
        with:
          name: deneme-videolari
          path: kaynaklar

      - name: Ac
        run: |
          $zip = Get-ChildItem -Recurse art -Filter *.zip | Select-Object -First 1
          "Arsiv: $($zip.Name) ($([math]::Round($zip.Length / 1MB, 1)) MB)"
          Expand-Archive $zip.FullName -DestinationPath ff
          $bin = (Get-ChildItem -Recurse ff -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Get-ChildItem $bin | ForEach-Object { "{0,-14} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          "FFBIN=$bin" >> $env:GITHUB_ENV
          "$bin" >> $env:GITHUB_PATH

      - name: Surum ve icerik
        run: |
          ffmpeg -hide_banner -version
          "--- yapilandirma"
          ffmpeg -hide_banner -buildconf
          "--- kodlayicilar (beklenen: libx264, h264_nvenc, libfdk_aac, pcm_s16le/s24le/s32le/f32le; hevc_nvenc ve av1_nvenc OLMAMALI)"
          ffmpeg -hide_banner -encoders | Select-String -Pattern ' (libx264|h264_nvenc|hevc_nvenc|av1_nvenc|libfdk_aac|pcm_s16le|pcm_s24le|pcm_s32le|pcm_f32le|libx265|libsvtav1|libvpx-vp9|libmp3lame|libopus) '
          "--- cozuculer"
          ffmpeg -hide_banner -decoders | Select-String -Pattern ' (h264|hevc|av1|libdav1d|vp9|vp8|prores|vvc|dnxhd|mpeg2video|aac|mp3float|opus|flac|ac3|eac3|vorbis|alac|pcm_s16le|pcm_s24le|pcm_f32le) '
          "--- protokoller (ag protokolu olmamali)"
          ffmpeg -hide_banner -protocols

      - name: x264 surumu
        shell: cmd
        run: |
          ffmpeg -hide_banner -f lavfi -i testsrc2=size=64x64:rate=1 -frames:v 1 -c:v libx264 -flags +global_header -f null - 2>&1 | findstr /C:"core"
          exit /b 0

      - name: Programin kodlama kodunu derle
        run: |
          dotnet build tools/ReliosExport.Smoke -c Release -o smoke --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory smoke/ffmpeg -Force | Out-Null
          Copy-Item "$env:FFBIN/ffmpeg.exe","$env:FFBIN/ffprobe.exe" smoke/ffmpeg/
          # Karsilastirma icin 0.3.0'in (ayar menusunden onceki, dogrulanmis) TikTok komut ureticisi
          dotnet build tools/ReliosExport.EskiKomut -c Release -o eski --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Birim kontrol (H.264 seviye hesabi, NVENC komutu, veri klasoru)
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          & ./smoke/ReliosExport.Smoke.exe --birim-kontrol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tum deneme videolari (programin kendi TikTok kodu + kontroller)
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $kok = (Resolve-Path kaynaklar).Path
          $man = Get-Content (Join-Path $kok manifest.json) -Raw -Encoding utf8 | ConvertFrom-Json
          $satirlar = @()
          $farklar = @()
          $hatali = 0
          $i = 0
          foreach ($k in $man) {
            $i++
            $src = Join-Path $kok $k.dosya
            if ($k.windows_adi) {
              $yeni = Join-Path $kok $k.windows_adi
              Copy-Item -LiteralPath $src -Destination $yeni -Force
              $src = $yeni
            }
            $dir = Join-Path $PWD "cikti/$i"
            Write-Host "::group::$i. $([IO.Path]::GetFileName($src)) - $($k.aciklama)"
            # Dikey 9:16 hazir ayari (x264, 1216x2160, 29,97 fps): XviD4PSP hedefiyle dogrulanan ayar
            $log = & ./smoke/ReliosExport.Smoke.exe $src $dir --profil tiktok-916 2>&1 | ForEach-Object { "$_" }
            $rc = $LASTEXITCODE
            $log | ForEach-Object { Write-Host $_ }
            $bilgi = (($log | Where-Object { $_ -like "Kaynak: *" } | Select-Object -First 1) -replace '^Kaynak: ', '')
            $hedef = "-"; $sag = "-"; $durum = "HATA (kodlama)"; $komut = "-"; $komutFarki = $false
            # Yeni programin komutu 0.3.0'inkiyle ayni mi (ayni adli ses dosyasi olan denemeler haric)
            if ($k.eski_komut -ne $false) {
              $yeniKomut = (($log | Where-Object { $_ -like "Komut 1/1: *" } | Select-Object -First 1) -replace '^Komut 1/1: ', '')
              $eskiKomut = (& ./eski/ReliosExport.EskiKomut.exe "$env:FFBIN/ffprobe.exe" $src 2>&1 | ForEach-Object { "$_" } | Select-Object -Last 1)
              # Bilincli farklar: x264 is parcacigi 7 -> 8 (islemcinin 8 cekirdegi); mono ses stereoya tam seviyede (pan);
              # Encoded / Tagged date: kodlama ani (creation_time=now)
              $normal = $yeniKomut -creplace ':threads=8:', ':threads=7:' -creplace 'x264-params threads=8:', 'x264-params threads=7:' -creplace ' -metadata creation_time=now', ''
              $monoNot = ''
              if ($normal -cmatch 'pan=stereo\|c0=c0\|c1=c0,') { $normal = $normal -creplace 'pan=stereo\|c0=c0\|c1=c0,', ''; $monoNot = ', mono ses iki kanala tam seviyede' }
              if ($normal -ceq $eskiKomut) { $komut = "aynı (iş parçacığı 8, kodlama tarihi$monoNot)" } else {
                $komut = "FARK"; $komutFarki = $true
                Write-Host "0.3.0 komutu: $eskiKomut"
                Write-Host "Yeni komut  : $yeniKomut"
                $farklar += "  $i. komut 0.3.0'dan farkli"
              }
            }
            if ($rc -eq 0) {
              $mp4 = (Get-ChildItem -LiteralPath $dir -Filter *.mp4 | Select-Object -First 1).FullName
              $h = & python -X utf8 -I tools/hedef_kontrol.py $mp4 8 2>&1 | ForEach-Object { "$_" }
              $hrc = $LASTEXITCODE
              $h | ForEach-Object { Write-Host $_ }
              $s = & python -X utf8 -I tools/saglamlik_kontrol.py $src $mp4 $k.matris $k.aralik ([int][bool]$k.ses) 2>&1 | ForEach-Object { "$_" }
              $src_rc = $LASTEXITCODE
              $s | ForEach-Object { Write-Host $_ }
              $hedef = ((($h | Where-Object { $_ -match '\d+ kontrol, \d+ fark' }) | Select-Object -Last 1) -replace '^.*?(\d+ kontrol, \d+ fark).*$', '$1')
              $sag = ((($s | Where-Object { $_ -match '\d+ kontrol, \d+ fark' }) | Select-Object -Last 1) -replace '^.*?(\d+ kontrol, \d+ fark).*$', '$1')
              $erc = 0
              if ($k.ek) {
                $e = & python -X utf8 -I tools/ayar_kontrol.py $mp4 @($k.ek -split ' ') 2>&1 | ForEach-Object { "$_" }
                $erc = $LASTEXITCODE
                $e | ForEach-Object { Write-Host $_ }
                $s += $e
              }
              $farklar += ($h + $s) | Where-Object { $_ -like "FARK*" } | ForEach-Object { "  $i. $_" }
              if ($hrc -eq 0 -and $src_rc -eq 0 -and $erc -eq 0 -and -not $komutFarki) { $durum = "OK" } else { $durum = "FARK"; $hatali++ }
            } else {
              $hatali++
              $farklar += "  $i. kodlama basarisiz (kod $rc)"
            }
            Write-Host "::endgroup::"
            $satirlar += "| $i | $($k.aciklama) | $bilgi | $komut | $hedef | $sag | $durum |"
          }
          $tablo = @("| # | Deneme videosu | Programin okudugu | 0.3.0 komutu | Hedef meta veri | Saglamlik | Sonuc |", "|---|---|---|---|---|---|---|") + $satirlar
          "`n===== OZET ====="
          $tablo | ForEach-Object { $_ }
          if ($farklar.Count) { "`nFarklar:"; $farklar | ForEach-Object { $_ } }
          $tablo | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($hatali) { "`n$hatali deneme videosunda sorun var."; exit 1 }
          "`nTum deneme videolari temiz."

      - name: Diger ayarlar (YouTube, TikTok, 2 / 3 gecis, WAV + MOV, siyah kenar, ses, NVENC komutu)
        if: always()
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $kok = (Resolve-Path kaynaklar).Path
          $man = Get-Content (Join-Path $kok manifest.json) -Raw -Encoding utf8 | ConvertFrom-Json
          function Kaynak($ad) { $man | Where-Object { $_.dosya -like "$ad*" } | Select-Object -First 1 }
          $yt = @('--profil', 'youtube')
          $testler = @(
            @{ ad = 'YouTube varsayilani: 1080p60 yatay H.264 High (XviD4PSP ayarlari, profil Main; boyut, fps, seviye kaynak)'; k = '01_'; arg = $yt; sag = @('--boyut', 'kaynak', '--fps', 'kaynak')
               hedef = @('--boyut', '1920x1080', '--fps', '60/1', '--gop', '100/51', '--vbv', '34375/55000', '--kap', 'mov', '--ses', 'aac'); ayar = @('kap=mov', 'acodec=aac', 'aprofil=LC', 'abit=128000±5%', 'ar=48000', 'ac=2') },
            @{ ad = 'YouTube varsayilani: telefon (dondurulmus HEVC 10 bit)'; k = '03_'; arg = $yt; sag = @('--boyut', 'kaynak', '--fps', 'kaynak')
               hedef = @('--boyut', '1080x1920', '--fps', '30/1', '--gop', '50/26', '--vbv', '34375/55000', '--kap', 'mov', '--ses', 'aac'); ayar = @('kap=mov', 'acodec=aac', 'aprofil=LC', 'abit=128000±5%', 'ar=48000', 'ac=2') },
            @{ ad = 'YouTube varsayilani: 1080x2400 uzun dikey'; k = '13_'; arg = $yt; sag = @('--boyut', 'kaynak', '--fps', 'kaynak')
               hedef = @('--boyut', '1080x2400', '--fps', '30/1', '--gop', '50/26', '--vbv', '34375/55000', '--kap', 'mov', '--ses', 'aac'); ayar = @('kap=mov', 'acodec=aac', 'aprofil=LC', 'abit=128000±5%', 'ar=48000', 'ac=2') },
            @{ ad = 'YouTube varsayilani: 32 bit float WAV sesli 4K50 ProRes'; k = '06_'; arg = $yt; sag = @('--boyut', 'kaynak', '--fps', 'kaynak')
               hedef = @('--boyut', '3840x2160', '--fps', '50/1', '--gop', '83/42', '--vbv', '34375/55000', '--kap', 'mov', '--ses', 'aac'); ayar = @('kap=mov', 'acodec=aac', 'aprofil=LC', 'abit=128000±5%', 'ar=48000', 'ac=2') },
            @{ ad = 'YouTube varsayilani: 1080x1920 29.97 fps H.264 High@4.0 (34375 kb/s 4.0 sinirini asar: seviye 4.1)'; k = '02_'; arg = $yt; sag = @('--boyut', 'kaynak', '--fps', 'kaynak')
               hedef = @('--boyut', '1080x1920', '--fps', '30000/1001', '--gop', '50/26', '--vbv', '34375/55000', '--kap', 'mov', '--ses', 'aac'); ayar = @('kap=mov', 'acodec=aac', 'aprofil=LC', 'abit=128000±5%', 'ar=48000', 'ac=2') },
            @{ ad = 'YouTube varsayilani: 1080x1080 sessiz H.264 High@3.2 (seviye 4.1)'; k = '07_'; arg = $yt; sag = @('--boyut', 'kaynak', '--fps', 'kaynak')
               hedef = @('--boyut', '1080x1080', '--fps', '30/1', '--gop', '50/26', '--vbv', '34375/55000', '--kap', 'mov'); ayar = @('kap=mov') },
            @{ ad = 'TikTok varsayilani: 1080p60 yatay H.264 High@4.2 (x264 veryslow CRF 24, High, 16 referans -> seviye 5.1, 8 B-kare, anahtar kare 10 sn; FDK AAC 128 kb/s 44,1 kHz)'; k = '01_'; arg = @(); sag = @('--boyut', 'kaynak', '--fps', 'kaynak')
               ayar = @('kap=mov', 'vcodec=h264', 'profil=High', 'seviye=5.1', 'x264:crf=24.0', 'x264:ref=16', 'x264:bframes=8', 'x264:b_pyramid=2', 'x264:b_adapt=2', 'x264:me=umh', 'x264:subme=10', 'x264:trellis=2', 'x264:8x8dct=1', 'x264:rc_lookahead=250', 'x264:keyint=600', 'x264:scenecut=40', 'x264:threads=8', 'acodec=aac', 'aprofil=LC', 'abit=128000±5%', 'ar=44100', 'ac=2') },
            @{ ad = 'TikTok varsayilani: 1080x1920 29.97 fps H.264 High@4.0 (seviye 5.1, anahtar kare 300 kare = 10 sn)'; k = '02_'; arg = @(); sag = @('--boyut', 'kaynak', '--fps', 'kaynak')
               ayar = @('kap=mov', 'profil=High', 'seviye=5.1', 'x264:crf=24.0', 'x264:ref=16', 'x264:keyint=300', 'x264:scenecut=40', 'acodec=aac', 'aprofil=LC', 'abit=128000±5%', 'ar=44100', 'ac=2') },
            @{ ad = 'x264 2 gecis 4000 kb/s'; k = '12_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Video.X264.Mod=IkiGecis', '--ayarla', 'Video.X264.BitHizi=4000'); sag = @()
               ayar = @('x264:rc=2pass', 'x264:bitrate=4000', 'vbit=4000000±30%') },
            @{ ad = 'x264 3 gecis 4000 kb/s'; k = '12_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Video.X264.Mod=UcGecis', '--ayarla', 'Video.X264.BitHizi=4000'); sag = @()
               ayar = @('x264:rc=2pass', 'x264:bitrate=4000', 'vbit=4000000±30%') },
            @{ ad = 'WAV ses (MOV kabi, 24 bit)'; k = '02_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Ses.Kodlayici=Wav'); sag = @()
               ayar = @('kap=mov', 'acodec=pcm_s24le', 'ar=48000', 'ac=2') },
            @{ ad = 'Oran farkliysa siyah kenar (21:9 -> 9:16)'; k = '12_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Video.Oran=KenarEkle'); sag = @('--oran', 'kenar')
               ayar = @('boyut=1216x2160') },
            @{ ad = 'Ses kaynagi: sessiz'; k = '10_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Ses.Kaynak=Sessiz'); sag = @(); ses = 0
               ayar = @('ses=yok') },
            @{ ad = 'Ses kaynagi: videonun sesi (yaninda WAV olsa da)'; k = '14_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Ses.Kaynak=VideonunSesi'); sag = @()
               ayar = @('ses_seviye=-12.1±2.5') },
            @{ ad = 'Ayni adli WAV + ses seviyesi -6 dB + 250 ms gecikme'; k = '15_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Ses.Seviye=-6', '--ayarla', 'Ses.Gecikme=250'); sag = @()
               ayar = @('ses_seviye=-42.8±2.5') },
            @{ ad = 'FDK HE-AAC 48 kb/s (Turkce adli kaynak)'; k = '08_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Ses.Fdk.Profil=aac_he', '--ayarla', 'Ses.Fdk.BitHizi=48'); sag = @()
               ayar = @('acodec=aac', 'aprofil=HE-AAC', 'abit=48000±10%') },
            @{ ad = 'TikTok NVENC ayari (0.10.0 varsayilani) komutu: H.264 High@4.2 60 fps kaynak (NVENC CBR 34375; ses WAV 16 bit, soxr 33 bit, ucgen titresim; kart yok: yalnizca komut)'; k = '01_'; arg = @('--profil', 'tiktok-nvenc', '--sadece-komut'); komut = @(
                 '-vf scale=trunc(iw*sar/2)*2:trunc(ih/2)*2:flags=lanczos', '-c:v h264_nvenc -preset p7 -tune hq -profile:v high -level:v 4.2 -rc cbr -b:v 34375k -bufsize 34375k',
                 '-bf 0 -refs 3 -dpb_size 3', '-coder cabac -g 30 -no-scenecut 1',
                 '-af aresample=48000:resampler=soxr:precision=33:dither_method=triangular -c:a pcm_s16le -ar 48000 -ac 2'); yok = @('crop=', 'fps=', '-b_ref_mode', 'libfdk_aac') },
            @{ ad = 'TikTok NVENC ayari komutu: HEVC 10 bit telefon kaynak (Main, seviye otomatik)'; k = '03_'; arg = @('--profil', 'tiktok-nvenc', '--sadece-komut'); komut = @(
                 '-c:v h264_nvenc -preset p7 -tune hq -profile:v main -rc cbr -b:v 34375k -bufsize 34375k', '-bf 0 -refs 3 -dpb_size 3', '-g 30'); yok = @('-level:v', 'crop=', 'fps=') },
            @{ ad = 'TikTok NVENC ayari komutu: High@3.2 kare kaynak (34375 kb/s 3.2 sinirini asar, NVENC reddederdi: seviye 4.1)'; k = '07_'; arg = @('--profil', 'tiktok-nvenc', '--sadece-komut'); komut = @(
                 '-c:v h264_nvenc -preset p7 -tune hq -profile:v high -level:v 4.1 -rc cbr -b:v 34375k -bufsize 34375k'); yok = @('-level:v 3.2') },
            @{ ad = 'Hata mesaji: TikTok NVENC ayari kart yokken (Turkce aciklama + gunluk dosyasi)'; k = '07_'; arg = @('--profil', 'tiktok-nvenc'); hata = 'NVENC kullanılamadı' }
          )
          $satirlar = @(); $hatali = 0; $i = 0
          foreach ($t in $testler) {
            $i++
            $k = Kaynak $t.k
            $src = Join-Path $kok $k.dosya
            if ($k.windows_adi) {
              $yeni = Join-Path $kok $k.windows_adi
              Copy-Item -LiteralPath $src -Destination $yeni -Force
              $src = $yeni
            }
            $dir = Join-Path $PWD "diger/$i"
            Write-Host "::group::$i. $($t.ad)"
            $log = & ./smoke/ReliosExport.Smoke.exe $src $dir @($t.arg) 2>&1 | ForEach-Object { "$_" }
            $rc = $LASTEXITCODE
            $log | ForEach-Object { Write-Host $_ }
            $sonuc = "OK"; $ozet = ""
            if ($t.hata) {
              # Bilerek basarisiz olan deneme: Turkce aciklama ve gunluk dosyasi olmali
              $mesaj = ($log | Where-Object { $_ -like "HATA: *" } | Select-Object -First 1)
              $gunluk = (($log | Where-Object { $_ -like "Günlük: *" } | Select-Object -First 1) -replace '^Günlük: ', '')
              if ($rc -eq 5 -and $mesaj -and $mesaj.Contains($t.hata) -and $gunluk -and (Test-Path -LiteralPath $gunluk)) {
                $ozet = "$mesaj · günlük $([math]::Round((Get-Item -LiteralPath $gunluk).Length / 1KB, 1)) KB"
                Write-Host "--- gunluk dosyasinin basi:"
                Get-Content -LiteralPath $gunluk -TotalCount 12 | ForEach-Object { Write-Host $_ }
              } else { $sonuc = "FARK"; $ozet = "beklenen hata yok (kod $rc): $mesaj" }
            }
            elseif ($rc -ne 0) { $sonuc = "HATA (kod $rc)" }
            elseif ($t.komut) {
              $satir = ($log | Where-Object { $_ -like "Komut 1/1: *" } | Select-Object -First 1)
              $eksik = @($t.komut | Where-Object { -not $satir.Contains($_) })
              $fazla = @($t.yok | Where-Object { $_ -and $satir.Contains($_) })
              if ($eksik.Count -or $fazla.Count) { $sonuc = "FARK"; $ozet = "komutta yok: " + ($eksik -join ' | ') + " · olmamali: " + ($fazla -join ' | ') }
              else { $ozet = "$($t.komut.Count) parça komutta var, $(@($t.yok).Count) parça yok" }
            } else {
              $out = (Get-ChildItem -LiteralPath $dir | Where-Object { $_.Extension -in '.mp4', '.mov' } | Select-Object -First 1).FullName
              $ses = if ($null -ne $t.ses) { $t.ses } else { [int][bool]$k.ses }
              $s = & python -X utf8 -I tools/saglamlik_kontrol.py $src $out $k.matris $k.aralik $ses @($t.sag) 2>&1 | ForEach-Object { "$_" }
              $src_rc = $LASTEXITCODE
              $a = & python -X utf8 -I tools/ayar_kontrol.py $out @($t.ayar) 2>&1 | ForEach-Object { "$_" }
              $arc = $LASTEXITCODE
              if ($t.hedef) {
                # Kaynakla ayni boyut / fps disinda her sey XviD4PSP hedefiyle ayni mi
                # YouTube varsayilani: profil Main (16 Kasim), seviye kaynakla ayni (yetmezse yeten en dusuk)
                $hd = & python -X utf8 -I tools/hedef_kontrol.py $out 8 @($t.hedef) '--profil' 'main' '--kaynak' $src 2>&1 | ForEach-Object { "$_" }
                if ($LASTEXITCODE -ne 0) { $arc = 1 }
                $a += $hd
              }
              ($s + $a) | ForEach-Object { Write-Host $_ }
              $ozet = ((($s + $a) | Where-Object { $_ -match '\d+ kontrol, \d+ fark' }) -replace '^(.*?): (\d+ kontrol, \d+ fark).*$', '$1 $2') -join ' · '
              if ($src_rc -ne 0 -or $arc -ne 0) { $sonuc = "FARK"; $ozet += " · " + ((($s + $a) | Where-Object { $_ -like "FARK*" }) -join ' | ') }
            }
            if ($sonuc -ne "OK") { $hatali++ }
            Write-Host "::endgroup::"
            $satirlar += "| $i | $($t.ad) | $ozet | $sonuc |"
          }
          $tablo = @("", "| # | Ayar denemesi | Kontroller | Sonuc |", "|---|---|---|---|") + $satirlar
          "`n===== DIGER AYARLAR ====="
          $tablo | ForEach-Object { $_ }
          $tablo | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($hatali) { "`n$hatali ayar denemesinde sorun var."; exit 1 }
          "`nTum ayar denemeleri temiz."
          exit 0  # son deneme bilerek hata koduyla biter; adimin sonucunu o belirlemesin

      - name: Ses donusumu denemesi (WAV 16 bit 48 kHz; 24 bit kaynakta ucgen titresim, 16 bit kaynakta bit bit ayni)
        if: always()
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # Gercek 24 bit ayrintili ses (aevalsrc double uretir) ile 24 bit ve 16 bit 48 kHz stereo deneme videolari
          $ses = 'aevalsrc=0.5*sin(2*PI*997*t)+0.001*sin(2*PI*3001*t)|0.4*sin(2*PI*1499*t):s=48000:d=2'
          $k24 = Join-Path $PWD 'ses_24bit_48k.mov'
          $k16 = Join-Path $PWD 'ses_16bit_48k.mov'
          foreach ($k in @(@($k24, 'pcm_s24le'), @($k16, 'pcm_s16le'))) {
            ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i $ses -t 2 -pix_fmt yuv420p -c:v libx264 -preset veryfast -c:a $k[1] -y $k[0]
            "$([IO.Path]::GetFileName($k[0])): " + (ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 $k[0])
          }
          $durumlar = @(
            @{ ad = 'YouTube, ses WAV secilirse (16 bit), 24 bit 48 kHz kaynak (ucgen titresim)'; src = $k24; arg = @('--profil', 'youtube', '--ayarla', 'Ses.Kodlayici=Wav'); kip = 'titresim' },
            @{ ad = 'YouTube, ses WAV secilirse (16 bit), 16 bit 48 kHz kaynak (bit bit ayni)'; src = $k16; arg = @('--profil', 'youtube', '--ayarla', 'Ses.Kodlayici=Wav'); kip = 'ayni' },
            @{ ad = 'TikTok, ses WAV 16 bit 48 kHz secilirse (video x264), 24 bit 48 kHz kaynak'; src = $k24; arg = @('--ayarla', 'Ses.Kodlayici=Wav', '--ayarla', 'Ses.OrnekHizi=48000'); kip = 'titresim' },
            @{ ad = 'TikTok, ses WAV 16 bit 48 kHz secilirse (video x264), 16 bit 48 kHz kaynak'; src = $k16; arg = @('--ayarla', 'Ses.Kodlayici=Wav', '--ayarla', 'Ses.OrnekHizi=48000'); kip = 'ayni' }
          )
          $satirlar = @(); $hatali = 0; $i = 0
          foreach ($d in $durumlar) {
            $i++
            $dir = Join-Path $PWD "ses/$i"
            Write-Host "::group::$i. $($d.ad)"
            $log = & ./smoke/ReliosExport.Smoke.exe $d.src $dir @($d.arg) 2>&1 | ForEach-Object { "$_" }
            $rc = $LASTEXITCODE
            $log | ForEach-Object { Write-Host $_ }
            $sonuc = 'OK'; $ozet = ''
            if ($rc -ne 0) { $sonuc = "HATA (kod $rc)" }
            else {
              $out = (Get-ChildItem -LiteralPath $dir | Where-Object { $_.Extension -in '.mp4', '.mov' } | Select-Object -First 1).FullName
              $c = & python -X utf8 -I tools/ses_donusum_kontrol.py $d.src $out $d.kip 2>&1 | ForEach-Object { "$_" }
              $crc = $LASTEXITCODE
              $c | ForEach-Object { Write-Host $_ }
              $ozet = (($c | Where-Object { $_ -match '^(OK|FARK) +(En büyük hata|Ortalama karesel hata|Örnekler bit bit aynı)' }) -replace '^\S+ +(.*?) +hedef: .*çıktı: (.*)$', '$1: $2') -join ' · '
              if ($crc -ne 0) { $sonuc = 'FARK'; $ozet += ' · ' + (($c | Where-Object { $_ -like 'FARK*' }) -join ' | ') }
            }
            if ($sonuc -ne 'OK') { $hatali++ }
            Write-Host "::endgroup::"
            $satirlar += "| $i | $($d.ad) | $ozet | $sonuc |"
          }
          $tablo = @("", "| # | Ses donusumu | Kontroller | Sonuc |", "|---|---|---|---|") + $satirlar
          "`n===== SES DONUSUMU ====="
          $tablo | ForEach-Object { $_ }
          $tablo | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($hatali) { "`n$hatali ses denemesinde sorun var."; exit 1 }
          "`n24 bit kaynak 16 bit'e ucgen titresimle indirildi; 16 bit 48 kHz kaynagin sesi bit bit ayni kaldi."
          exit 0

      - name: Ses yuksekligi denemesi (tepe sinirlayici -1 dB; LUFS esitleme -14 sabit kazanc / sinirlayici + telafi / dokunulmadi)
        if: always()
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # Yuksek ton: 0,9 genlik, ilk 1 sn sessiz (+12 dB ile tasar). Tiz ton 44,1 kHz: 11025 Hz ornekler arasinda
          # tepe yapar (orneklerin 1,41 kati); sinirlayici kaynagin hizinda calissaydi 48 kHz'te tam olcekte kirpilirdi. Kisik degisken: ~-30 LUFS, yavas inip cikan (dogrusal).
          # Tepeli: kisik degisken + 2 sn'de bir 10 ms'lik yuksek vurus (sabit kazanc tepeyi asar: sinirlayici + telafi).
          # Sabit ton: hic degismeyen (LRA 0). Genis aralik: ilk 4 sn 18 dB kisik (LRA > 11; eskiden dinamikti, hedefte kalmiyordu).
          # Yuksek degisken: ~-7 LUFS, 16 bit 48 kHz (yalnizca yukselt: dokunulmamali, bit bit ayni).
          # Sonu kisik / sonu yuksek: son 3 sn sesin geri kalanindan 6 dB kisik / yuksek. loudnorm'un olcumu sesin son
          # ~2,9 sn'sini iki kez sayar: bu seslerde cikti -13,4 / -15,0 olurdu; BS.1770 olceriyle tam -14 olmali.
          # Tizli pembe / beyaz gurultu (iki kanal ayni): tizi bol ses. AAC 128 kb/s ~17 kHz ustunu keser, olculen yukseklik duser (kullanicinin
          # OBS kaydinda 0,16 LU; beyaz gurultude ~1,5 LU). Program sesi AAC'ye cevirip dener ve kaybi telafi eder: tam -14.
          $deg = '(0.03+0.015*sin(2*PI*0.1*t))'
          $kaynaklar = @(
            @{ ad = 'yuksek_ton'; ses = 'aevalsrc=if(gte(t\,1)\,0.9*sin(2*PI*440*t)\,0)|if(gte(t\,1)\,0.9*sin(2*PI*660*t)\,0):s=48000:d=4'; d = 4; c = 'pcm_s24le' },
            @{ ad = 'tiz_ton_44k'; ses = 'aevalsrc=if(gte(t\,1)\,0.5*sin(2*PI*11025*t+PI/4)+0.3*sin(2*PI*440*t)\,0)|if(gte(t\,1)\,0.5*sin(2*PI*11025*t+PI/4)+0.3*sin(2*PI*660*t)\,0):s=44100:d=4'; d = 4; c = 'pcm_s24le' },
            @{ ad = 'kisik_degisken'; ses = "aevalsrc=$deg*sin(2*PI*440*t)|$deg*sin(2*PI*550*t):s=48000:d=12"; d = 12; c = 'pcm_s24le' },
            @{ ad = 'kisik_degisken_44k'; ses = "aevalsrc=$deg*sin(2*PI*440*t)|$deg*sin(2*PI*550*t):s=44100:d=12"; d = 12; c = 'pcm_s24le' },
            @{ ad = 'tepeli'; ses = "aevalsrc=$deg*sin(2*PI*440*t)+if(lt(mod(t\,2)\,0.01)\,0.8*sin(2*PI*1000*t)\,0)|$deg*sin(2*PI*550*t):s=48000:d=12"; d = 12; c = 'pcm_s24le' },
            @{ ad = 'sabit_ton'; ses = 'aevalsrc=0.05*sin(2*PI*440*t)+0.02*sin(2*PI*3000*t)|0.05*sin(2*PI*550*t):s=48000:d=9'; d = 9; c = 'pcm_s24le' },
            @{ ad = 'genis_aralik'; ses = 'aevalsrc=if(lt(t\,4)\,0.0076\,0.06)*sin(2*PI*440*t)|if(lt(t\,4)\,0.0076\,0.06)*sin(2*PI*550*t):s=48000:d=12'; d = 12; c = 'pcm_s24le' },
            @{ ad = 'yuksek_degisken'; ses = 'aevalsrc=(0.40+0.12*sin(2*PI*0.1*t))*sin(2*PI*1000*t)|(0.40+0.12*sin(2*PI*0.1*t))*sin(2*PI*1250*t):s=48000:d=12'; d = 12; c = 'pcm_s16le' },
            @{ ad = 'kisik_son'; ses = 'aevalsrc=if(lt(t\,9)\,0.03\,0.015)*sin(2*PI*440*t)|if(lt(t\,9)\,0.03\,0.015)*sin(2*PI*550*t):s=48000:d=12'; d = 12; c = 'pcm_s24le' },
            @{ ad = 'yuksek_son'; ses = 'aevalsrc=if(lt(t\,9)\,0.015\,0.03)*sin(2*PI*440*t)|if(lt(t\,9)\,0.015\,0.03)*sin(2*PI*550*t):s=48000:d=12'; d = 12; c = 'pcm_s24le' },
            @{ ad = 'tizli_pembe'; ses = 'anoisesrc=c=pink:r=48000:a=0.1:s=1234:d=12,pan=stereo|c0=c0|c1=c0'; d = 12; c = 'pcm_s24le' },
            @{ ad = 'tizli_beyaz'; ses = 'anoisesrc=c=white:r=48000:a=0.02:s=4321:d=12,pan=stereo|c0=c0|c1=c0'; d = 12; c = 'pcm_s24le' }
          )
          $Kay = @{}  # (PowerShell degisken adlarinda buyuk / kucuk harf ayirmaz: $k ile ayni olmasin)
          foreach ($k in $kaynaklar) {
            $yol = Join-Path $PWD "$($k.ad).mov"
            ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i $k.ses -t $k.d -pix_fmt yuv420p -c:v libx264 -preset veryfast -c:a $k.c -y $yol
            $Kay[$k.ad] = $yol
            "$($k.ad).mov: " + (ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 $yol)
          }
          # Ayni adli kisik WAV (videonun kendi sesi yok) ve iki ses izli video (1. iz yuksek AAC, 2. iz kisik PCM:
          # program kayipsiz izi secer; olcum de o izden yapilmali).
          $hk = Join-Path $PWD 'harici_kisik.mov'
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -t 12 -pix_fmt yuv420p -c:v libx264 -preset veryfast -an -y $hk
          ffmpeg -hide_banner -loglevel error -f lavfi -i "aevalsrc=$deg*sin(2*PI*440*t)|$deg*sin(2*PI*550*t):s=48000:d=12" -c:a pcm_s24le -y (Join-Path $PWD 'harici_kisik.wav')
          $Kay['harici_kisik'] = $hk
          # Ayni adli WAV, sonu kisik (2,5 sn video + 2,5 sn WAV; son 0,4 sn 6 dB kisik). 0.11.0'a kadar "-shortest" sesi
          # video bitince son AAC karesinde (~16 ms once) keserdi: olcumun son 0,4 sn'lik blogu duserdi, cikti ~0,15 LU
          # yuksek kalirdi (kullanicinin 07_harici'sinde -13,95). Artik ses videonun suresine tam getirilir (atrim + apad),
          # olcum ve telafi denemesi ayni zincirle: tam -14, ses ornek sayisi WAV'inkiyle ayni.
          $hs = Join-Path $PWD 'harici_son.mov'
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -t 2.5 -pix_fmt yuv420p -c:v libx264 -preset veryfast -an -y $hs
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'aevalsrc=if(lt(t\,2.1)\,0.05\,0.025)*sin(2*PI*1000*t)|if(lt(t\,2.1)\,0.05\,0.025)*sin(2*PI*1250*t):s=48000:d=2.5' -c:a pcm_s24le -y (Join-Path $PWD 'harici_son.wav')
          $Kay['harici_son'] = $hs
          "harici_son.mov / .wav suresi: " + (ffprobe -v error -show_entries format=duration -of csv=p=0 $hs) + ' / ' + (ffprobe -v error -show_entries format=duration -of csv=p=0 (Join-Path $PWD 'harici_son.wav'))
          $ci = Join-Path $PWD 'cok_izli.mov'
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i 'aevalsrc=0.5*sin(2*PI*1000*t):s=48000' -f lavfi -i "aevalsrc=$deg*sin(2*PI*440*t)|$deg*sin(2*PI*550*t):s=48000" -map 0:v -map 1:a -map 2:a -t 12 -pix_fmt yuv420p -c:v libx264 -preset veryfast -c:a:0 aac -c:a:1 pcm_s24le -y $ci
          $Kay['cok_izli'] = $ci
          "cok_izli.mov: " + ((ffprobe -v error -show_entries stream=codec_name -select_streams a -of csv=p=0 $ci) -join ' + ')
          # YouTube (x264) + ses WAV 16 bit: ses ornekleri bit bit denetlenebilsin. YouTube'un kendi sesi (FDK AAC 128) ayrica denenir.
          $yt = @('--profil', 'youtube', '--ayarla', 'Ses.Kodlayici=Wav')
          $esit = @('--ayarla', 'Ses.Esitleme=true')
          $durumlar = @(
            @{ ad = 'Ses +12 dB, sinirlayici acik (varsayilan, -1 dB)'; src = $Kay.yuksek_ton; arg = $yt + @('--ayarla', 'Ses.Seviye=12'); arac = 'yukseklik'; kip = @('sinir'); karar = $null },
            @{ ad = 'Ses +12 dB, tiz ton 44,1 kHz (ornekler arasi tepe) -> gercek tepe -1 dB, kirpilma yok'; src = $Kay.tiz_ton_44k; arg = $yt + @('--ayarla', 'Ses.Seviye=12'); arac = 'yukseklik'; kip = @('sinir'); karar = $null },
            @{ ad = 'Ses +12 dB, sinirlayici kapali (kirpilir)'; src = $Kay.yuksek_ton; arg = $yt + @('--ayarla', 'Ses.Seviye=12', '--ayarla', 'Ses.Sinirlayici=false'); arac = 'yukseklik'; kip = @('kirpik'); karar = $null },
            @{ ad = 'Esitleme: kisik, inip cikan ses (YouTube) -> dogrusal, yalnizca yukseltildi'; src = $Kay.kisik_degisken; arg = $yt + $esit; arac = 'yukseklik'; kip = @('dogrusal', '--kaynak', $Kay.kisik_degisken); karar = 'Dogrusal' },
            @{ ad = 'Esitleme: kisik, 44,1 kHz, ornekleme kaynakla ayni (TikTok, ses WAV, video x264) -> dogrusal'; src = $Kay.kisik_degisken_44k; arg = @('--ayarla', 'Ses.Kodlayici=Wav', '--ayarla', 'Ses.OrnekHizi=null') + $esit; arac = 'yukseklik'; kip = @('dogrusal', '--hz', '44100', '--kaynak', $Kay.kisik_degisken_44k); karar = 'Dogrusal' },
            @{ ad = 'Esitleme: kisik + ani tepeler -> sabit kazanc + sinirlayici + telafi, -14, tepe -1 dB, kirpilma yok'; src = $Kay.tepeli; arg = $yt + $esit; arac = 'yukseklik'; kip = @('tepeli'); karar = 'Dogrusal/Sinirli' },
            @{ ad = 'Esitleme: hic degismeyen ton -> sabit kazanc'; src = $Kay.sabit_ton; arg = $yt + $esit; arac = 'yukseklik'; kip = @('dogrusal', '--kaynak', $Kay.sabit_ton); karar = 'Dogrusal' },
            @{ ad = 'Esitleme: genis aralik (kisik baslangic, LRA > 11) -> sabit kazanc, tam -14'; src = $Kay.genis_aralik; arg = $yt + $esit; arac = 'yukseklik'; kip = @('dogrusal', '--kaynak', $Kay.genis_aralik); karar = 'Dogrusal' },
            @{ ad = 'Esitleme: yuksek ses (-7), yalnizca yukselt -> dokunulmadi (bit bit ayni)'; src = $Kay.yuksek_degisken; arg = $yt + $esit; arac = 'donusum'; kip = @('ayni'); karar = 'ZatenYuksek' },
            @{ ad = 'Esitleme: kisik ses, mono cikti -> once mono, sonra -14'; src = $Kay.kisik_degisken; arg = $yt + $esit + @('--ayarla', 'Ses.Kanal=Mono'); arac = 'yukseklik'; kip = @('lufs'); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + ayni adli WAV (kisik) -> olcum WAV''dan, dogrusal'; src = $Kay.harici_kisik; arg = $yt + $esit; arac = 'yukseklik'; kip = @('lufs'); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + iki ses izli video -> kayipsiz (kisik) iz olculur, dogrusal'; src = $Kay.cok_izli; arg = $yt + $esit; arac = 'yukseklik'; kip = @('lufs'); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + YouTube varsayilani (FDK AAC 128 kb/s)'; src = $Kay.kisik_degisken; arg = @('--profil', 'youtube'); arac = 'yukseklik'; kip = @('lufs', '--codec', 'aac', '--pay', '0.05'); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + AAC 128 kb/s, tizi bol ses (pembe gurultu) -> AAC payi telafi edilir, tam -14'; src = $Kay.tizli_pembe; arg = @('--profil', 'youtube'); arac = 'yukseklik'; kip = @('lufs', '--codec', 'aac', '--pay', '0.05'); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + AAC 128 kb/s, tizi cok bol ses (beyaz gurultu) -> AAC payi telafi edilir, tam -14'; src = $Kay.tizli_beyaz; arg = @('--profil', 'youtube'); arac = 'yukseklik'; kip = @('lufs', '--codec', 'aac', '--pay', '0.05'); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + AAC 64 kb/s, tizi bol ses (pembe gurultu) -> AAC payi telafi edilir, tam -14'; src = $Kay.tizli_pembe; arg = @('--profil', 'youtube', '--ayarla', 'Ses.Fdk.BitHizi=64'); arac = 'yukseklik'; kip = @('lufs', '--codec', 'aac', '--pay', '0.05'); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + TikTok varsayilani (FDK AAC 128 kb/s 44,1 kHz, 48 kHz kaynak)'; src = $Kay.kisik_degisken; arg = @(); arac = 'yukseklik'; kip = @('lufs', '--codec', 'aac', '--pay', '0.05', '--hz', '44100'); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + TikTok varsayilani, tizi bol ses (pembe gurultu) -> AAC payi telafi edilir, tam -14'; src = $Kay.tizli_pembe; arg = @(); arac = 'yukseklik'; kip = @('lufs', '--codec', 'aac', '--pay', '0.05', '--hz', '44100'); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + ayni adli WAV, sonu kisik (TikTok varsayilani, AAC 44,1 kHz) -> ses videoyla tam ayni uzunlukta, tam -14'; src = $Kay.harici_son; arg = @(); arac = 'yukseklik'; kip = @('lufs', '--codec', 'aac', '--pay', '0.05', '--hz', '44100'); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + ayni adli WAV, sonu kisik, ses WAV -> sabit kazanc, ses ornek sayisi WAV ile ayni, tam -14'; src = $Kay.harici_son; arg = $yt + $esit; arac = 'yukseklik'; kip = @('dogrusal', '--kaynak', (Join-Path $PWD 'harici_son.wav')); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + WAV, tizi cok bol ses (beyaz gurultu) -> kayipsiz, deneme yok, tam -14'; src = $Kay.tizli_beyaz; arg = $yt + $esit; arac = 'yukseklik'; kip = @('dogrusal', '--kaynak', $Kay.tizli_beyaz); karar = 'Dogrusal' },
            @{ ad = 'Esitleme: sonu kisik ses (son 3 sn -6 dB) -> tam -14 (loudnorm olcumuyle -13,4 olurdu)'; src = $Kay.kisik_son; arg = $yt + $esit; arac = 'yukseklik'; kip = @('dogrusal', '--kaynak', $Kay.kisik_son); karar = 'Dogrusal' },
            @{ ad = 'Esitleme: sonu yuksek ses (son 3 sn +6 dB) -> tam -14 (loudnorm olcumuyle -15,0 olurdu)'; src = $Kay.yuksek_son; arg = $yt + $esit; arac = 'yukseklik'; kip = @('dogrusal', '--kaynak', $Kay.yuksek_son); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + x264 2 gecis (4000 kb/s) -> yalnizca yukseltildi'; src = $Kay.kisik_degisken; arg = $yt + $esit + @('--ayarla', 'Video.X264.Mod=IkiGecis', '--ayarla', 'Video.X264.BitHizi=4000'); arac = 'yukseklik'; kip = @('dogrusal', '--kaynak', $Kay.kisik_degisken); karar = 'Dogrusal' },
            @{ ad = 'Esitleme + ses gecikmesi +250 ms'; src = $Kay.kisik_degisken; arg = $yt + $esit + @('--ayarla', 'Ses.Gecikme=250'); arac = 'yukseklik'; kip = @('lufs'); karar = 'Dogrusal' },
            @{ ad = 'Esitleme: yuksek ses (-7), iki yon -> dogrusal, yalnizca kisildi'; src = $Kay.yuksek_degisken; arg = $yt + $esit + @('--ayarla', 'Ses.EsitlemeYonu=IkiYon'); arac = 'yukseklik'; kip = @('dogrusal', '--kaynak', $Kay.yuksek_degisken); karar = 'Dogrusal' }
          )
          $satirlar = @(); $hatali = 0; $i = 0
          foreach ($d in $durumlar) {
            $i++
            $dir = Join-Path $PWD "yukseklik/$i"
            Write-Host "::group::$i. $($d.ad)"
            $log = & ./smoke/ReliosExport.Smoke.exe $d.src $dir @($d.arg) 2>&1 | ForEach-Object { "$_" }
            $rc = $LASTEXITCODE
            $log | ForEach-Object { Write-Host $_ }
            $sonuc = 'OK'; $ozet = ''
            if ($rc -ne 0) { $sonuc = "HATA (kod $rc)" }
            else {
              $karar = (($log | Where-Object { $_ -like 'ESITLEME_KARAR=*' }) -replace '^ESITLEME_KARAR=', '') -join ''
              $prog = (($log | Where-Object { $_ -like 'ESITLEME_SONUC=*' }) -replace '^ESITLEME_SONUC=', '') -join ''
              if ($d.karar -and $karar -ne $d.karar) { $sonuc = 'FARK'; $ozet += "karar: beklenen $($d.karar), cikti $karar · " }
              elseif ($d.karar) { $ozet += "karar: $karar · " }
              $out = (Get-ChildItem -LiteralPath $dir | Where-Object { $_.Extension -in '.mp4', '.mov' } | Select-Object -First 1).FullName
              $ek = @($d.kip)
              if ($d.arac -eq 'yukseklik') {
                if ($prog) { $ek += @('--program', $prog) }
                elseif ($d.karar -like 'Dogrusal*') { $sonuc = 'FARK'; $ozet += 'program sonucu yazmadi · ' }
                $c = & python -X utf8 -I tools/ses_yukseklik_kontrol.py $out @ek 2>&1 | ForEach-Object { "$_" }
              } else {
                $c = & python -X utf8 -I tools/ses_donusum_kontrol.py $d.src $out @ek 2>&1 | ForEach-Object { "$_" }
              }
              $crc = $LASTEXITCODE
              $c | ForEach-Object { Write-Host $_ }
              $ozet += (($c | Where-Object { $_ -match '^(OK|FARK) ' -and $_ -notmatch 'codec|Örnekleme hızı|Kanal|Kaynak' }) -replace '^\S+ +(.*?) +hedef: .*çıktı: (.*)$', '$1: $2') -join ' · '
              if ($crc -ne 0) { $sonuc = 'FARK' }
            }
            if ($sonuc -ne 'OK') { $hatali++ }
            Write-Host "::endgroup::"
            $satirlar += "| $i | $($d.ad) | $ozet | $sonuc |"
          }
          $tablo = @("", "| # | Ses yuksekligi | Kontroller | Sonuc |", "|---|---|---|---|") + $satirlar
          "`n===== SES YUKSEKLIGI ====="
          $tablo | ForEach-Object { $_ }
          $tablo | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($hatali) { "`n$hatali ses yuksekligi denemesinde sorun var."; exit 1 }
          "`nSinirlayici tepeyi (orneklerin arasindaki gercek tepe dahil) -1 dB'de tuttu; esitleme butun sese yalnizca sabit kazanc uyguladi, tepeyi asan seste sinirlayici + telafiyle -14'e ulasti, yuksek sese dokunmadi."
          exit 0

      - name: Tahmini boyut denemesi (programin yazdigi tahmin gercek dosyayla karsilastirilir)
        if: always()
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $src = Join-Path $PWD 'boyut_kaynak.mov'
          # Gercekci (sikistirilabilir) goruntu, 30 sn. (Saf parazitte x264'un qpmax 33 siniri bit hizini asar; bu
          # uc durum tahminin ipucunda yazar.)
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30 -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 30 -pix_fmt yuv420p -c:v libx264 -preset veryfast -crf 18 -c:a aac -ac 2 -y $src
          $yt = @('--profil', 'youtube')
          $durumlar = @(
            @{ ad = 'x264 CBR 8000 kb/s (tampon 2 sn) + WAV 16 bit'; arg = $yt + @('--ayarla', 'Ses.Kodlayici=Wav', '--ayarla', 'Video.X264.Mod=Cbr', '--ayarla', 'Video.X264.BitHizi=8000', '--ayarla', 'Video.X264.VbvTampon=null'); tur = 'Yaklasik'; pay = 0.05 },
            @{ ad = 'x264 2 gecis 5000 kb/s + FDK AAC 128 kb/s (YouTube sesi)'; arg = $yt + @('--ayarla', 'Video.X264.Mod=IkiGecis', '--ayarla', 'Video.X264.BitHizi=5000'); tur = 'Yaklasik'; pay = 0.10 },
            @{ ad = 'x264 CBR 6000 kb/s (tampon 2 sn) + FDK AAC 192 kb/s'; arg = $yt + @('--ayarla', 'Video.X264.Mod=Cbr', '--ayarla', 'Video.X264.BitHizi=6000', '--ayarla', 'Video.X264.VbvTampon=null', '--ayarla', 'Ses.Kodlayici=FdkAac', '--ayarla', 'Ses.Fdk.BitHizi=192'); tur = 'Yaklasik'; pay = 0.05 },
            @{ ad = 'YouTube varsayilani (CRF 18, en yuksek 34375 kb/s): en cok'; arg = $yt; tur = 'EnCok'; pay = 0.01 }
          )
          $satirlar = @(); $hatali = 0; $i = 0
          foreach ($d in $durumlar) {
            $i++
            $dir = Join-Path $PWD "boyut/$i"
            Write-Host "::group::$i. $($d.ad)"
            $log = & ./smoke/ReliosExport.Smoke.exe $src $dir @($d.arg) 2>&1 | ForEach-Object { "$_" }
            $rc = $LASTEXITCODE
            $log | ForEach-Object { Write-Host $_ }
            Write-Host "::endgroup::"
            $t = ($log | Where-Object { $_ -match '^TAHMIN_BAYT=(\d+) TAHMIN_TUR=(\w+)' } | Select-Object -First 1)
            $sonuc = 'OK'; $ozet = ''
            if ($rc -ne 0 -or -not $t) { $sonuc = "HATA (kod $rc, tahmin: $t)" }
            else {
              $null = $t -match '^TAHMIN_BAYT=(\d+) TAHMIN_TUR=(\w+)'
              $tahmin = [double]$Matches[1]; $tur = $Matches[2]
              $out = (Get-ChildItem -LiteralPath $dir | Where-Object { $_.Extension -in '.mp4', '.mov' } | Select-Object -First 1)
              $gercek = [double]$out.Length
              $oran = ($gercek - $tahmin) / $tahmin
              $ozet = "tahmin {0:N0} bayt ({1}) · gercek {2:N0} bayt · fark {3:+0.0;-0.0}%" -f $tahmin, $tur, $gercek, ($oran * 100)
              if ($tur -ne $d.tur) { $sonuc = 'FARK'; $ozet += " · beklenen tur $($d.tur)" }
              elseif ($d.tur -eq 'EnCok' -and $oran -gt $d.pay) { $sonuc = 'FARK'; $ozet += ' · gercek tahminden buyuk' }
              elseif ($d.tur -eq 'Yaklasik' -and [math]::Abs($oran) -gt $d.pay) { $sonuc = 'FARK'; $ozet += " · pay %$($d.pay * 100)" }
            }
            if ($sonuc -ne 'OK') { $hatali++ }
            $satirlar += "| $i | $($d.ad) | $ozet | $sonuc |"
          }
          $tablo = @("", "| # | Tahmini boyut | Karsilastirma | Sonuc |", "|---|---|---|---|") + $satirlar
          "`n===== TAHMINI BOYUT ====="
          $tablo | ForEach-Object { $_ }
          $tablo | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($hatali) { "`n$hatali tahmini boyut denemesinde sorun var."; exit 1 }
          "`nTahmini boyut gercek dosyayla uyumlu."
          exit 0

      - name: x264 seviye denemesi (programin sectigi seviyede x264 uyarmamali, bir alt seviyede uyarmali)
        if: always()
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $kok = (Resolve-Path kaynaklar).Path
          $man = Get-Content (Join-Path $kok manifest.json) -Raw -Encoding utf8 | ConvertFrom-Json
          function Kaynak($ad) { Join-Path $kok ($man | Where-Object { $_.dosya -like "$ad*" } | Select-Object -First 1).dosya }
          # 352x288 7,5 fps High@1.1: seviye en cok 2 referans kare tasir (B-kare / B-piramit denemeleri icin)
          $cif = Join-Path $PWD 'cif_11.mp4'
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=352x288:rate=15/2 -t 2 -pix_fmt yuv420p -c:v libx264 -preset ultrafast -profile:v high -level:v 1.1 -x264-params 8x8dct=1 -y $cif
          "CIF kaynak (profil, seviye): " + (ffprobe -v error -select_streams v:0 -show_entries stream=profile,level -of csv=p=0 $cif)
          $sira = @('1.0', '1b', '1.1', '1.2', '1.3', '2.0', '2.1', '2.2', '3.0', '3.1', '3.2', '4.0', '4.1', '4.2', '5.0', '5.1', '5.2', '6.0', '6.1', '6.2')
          function A([string[]]$ayarlar) { $ayarlar | ForEach-Object { '--ayarla'; $_ } }
          $vbvYok = A 'Video.X264.VbvMaks=null', 'Video.X264.VbvTampon=null'
          $durumlar = @(
            @{ ad = 'YouTube varsayilani, 1080p30 High@4.0'; k = '10_'; arg = @(); bek = '4.1'; alt = $true },
            @{ ad = 'YouTube varsayilani, 1080x1920 29.97 High@4.0'; k = '02_'; arg = @(); bek = '4.1'; alt = $true },
            @{ ad = 'YouTube varsayilani, 1080x1080 High@3.2'; k = '07_'; arg = @(); bek = '4.1'; alt = $true },
            @{ ad = 'YouTube varsayilani, 1080p60 High@4.2 (ayni kalir)'; k = '01_'; arg = @(); bek = '4.2' },
            @{ ad = 'YouTube varsayilani, 1080x2400 High@5.0 (ayni kalir)'; k = '13_'; arg = @(); bek = '5.0' },
            @{ ad = 'VBV bos: kaynagin 4.0 seviyesi yeter'; k = '10_'; arg = $vbvYok; bek = '4.0' },
            @{ ad = 'Referans 5 (1080p 4.x en cok 4 kare)'; k = '10_'; arg = (A 'Video.X264.Ref=5'); bek = '5.0'; alt = $true },
            @{ ad = 'slow, referans bos (ffmpeg seviyeye kisar)'; k = '10_'; arg = (A 'Video.X264.OnAyar=slow', 'Video.X264.Ref=null'); bek = '4.1'; alt = $true },
            @{ ad = 'veryslow, referans ve B-kare bos'; k = '10_'; arg = (A 'Video.X264.OnAyar=veryslow', 'Video.X264.Ref=null', 'Video.X264.BKare=null'); bek = '4.1'; alt = $true },
            @{ ad = 'animation, referans ve B-kare bos'; k = '10_'; arg = (A 'Video.X264.Ayar=animation', 'Video.X264.Ref=null', 'Video.X264.BKare=null'); bek = '4.1'; alt = $true },
            @{ ad = 'Blu-ray uyumlu, referans 8 (x264 en cok 6 kullanir)'; k = '10_'; arg = (A 'Video.X264.Ref=8', 'Video.X264.BlurayUyumlu=true'); bek = '5.0'; alt = $true },
            @{ ad = 'CBR 40000, tampon bos (2 kati: 80000)'; k = '10_'; arg = (A 'Video.X264.Mod=Cbr', 'Video.X264.BitHizi=40000', 'Video.X264.VbvTampon=null'); bek = '5.0'; alt = $true },
            @{ ad = 'Profil high, 8x8 DCT kapali, VBV 55000 / 70000 (dosya Main olur)'; k = '10_'; arg = (A 'Video.X264.Profil=high', 'Video.X264.Dct8x8=false', 'Video.X264.VbvMaks=55000', 'Video.X264.VbvTampon=70000'); bek = '5.0'; alt = $true },
            @{ ad = 'Profil kaynak (High), VBV 55000 / 70000'; k = '10_'; arg = (A 'Video.X264.Profil=kaynak', 'Video.X264.VbvMaks=55000', 'Video.X264.VbvTampon=70000'); bek = '4.1'; alt = $true },
            @{ ad = 'YouTube varsayilani (Main), VBV 55000 / 70000 (Main 4.1 / 4.2 siniri 50000 / 62500: 5.0)'; k = '10_'; arg = (A 'Video.X264.VbvMaks=55000', 'Video.X264.VbvTampon=70000'); bek = '5.0'; alt = $true },
            @{ ad = 'TikTok varsayilani (veryslow, 16 referans, 8 B-kare), 1080p60 High@4.2'; k = '01_'; p = @(); arg = @(); bek = '5.1'; alt = $true },
            @{ ad = 'TikTok varsayilani, 1080x1920 29.97 High@4.0'; k = '02_'; p = @(); arg = @(); bek = '5.1'; alt = $true },
            @{ ad = 'TikTok varsayilani, 1080p30 High@4.0'; k = '10_'; p = @(); arg = @(); bek = '5.1'; alt = $true },
            @{ ad = 'CIF 1.1: 3 referans'; k = 'cif'; arg = $vbvYok; bek = '1.2'; alt = $true },
            @{ ad = 'CIF 1.1: 2 referans'; k = 'cif'; arg = $vbvYok + (A 'Video.X264.Ref=2'); bek = '1.1' },
            @{ ad = 'CIF 1.1: 2 referans, 1 B-kare (piramit olmaz)'; k = 'cif'; arg = $vbvYok + (A 'Video.X264.Ref=2', 'Video.X264.BKare=1'); bek = '1.1' },
            @{ ad = 'CIF 1.1: 2 referans, 2 B-kare (piramit: 4 kare)'; k = 'cif'; arg = $vbvYok + (A 'Video.X264.Ref=2', 'Video.X264.BKare=2'); bek = '1.2'; alt = $true },
            @{ ad = 'CIF 1.1: 2 referans, 2 B-kare, piramit yok'; k = 'cif'; arg = $vbvYok + (A 'Video.X264.Ref=2', 'Video.X264.BKare=2', 'Video.X264.BPiramit=none'); bek = '1.1' },
            @{ ad = 'CIF 1.1: referans ve B-kare bos (medium: 3 B-kare, piramit)'; k = 'cif'; arg = $vbvYok + (A 'Video.X264.Ref=null', 'Video.X264.BKare=null'); bek = '1.2'; alt = $true },
            @{ ad = 'CIF 1.1: referans ve B-kare bos, ultrafast (B-kare yok)'; k = 'cif'; arg = $vbvYok + (A 'Video.X264.OnAyar=ultrafast', 'Video.X264.Ref=null', 'Video.X264.BKare=null'); bek = '1.1' },
            @{ ad = 'CIF 1.1: ultrafast + animation (2 B-kare, piramit)'; k = 'cif'; arg = $vbvYok + (A 'Video.X264.OnAyar=ultrafast', 'Video.X264.Ayar=animation', 'Video.X264.Ref=null', 'Video.X264.BKare=null'); bek = '1.2'; alt = $true }
          )
          $satirlar = @(); $hatali = 0; $i = 0
          foreach ($d in $durumlar) {
            $i++
            $src = if ($d.k -eq 'cif') { $cif } else { Kaynak $d.k }
            # Profil verilmemisse YouTube; 'p' bos ise TikTok varsayilani
            $prof = if ($d.ContainsKey('p')) { @($d.p) } else { @('--profil', 'youtube') }
            $log = & ./smoke/ReliosExport.Smoke.exe $src (Join-Path $PWD "seviye/$i") @prof '--sadece-komut' @($d.arg) 2>&1 | ForEach-Object { "$_" }
            $komut = [string]($log | Where-Object { $_ -like 'Komut 1/*' } | Select-Object -First 1)
            function Al($desen) { if ($komut -match $desen) { $Matches[1] } else { $null } }
            $sev = Al ' -level:v (\S+)'
            $ffArg = @('-preset', (Al ' -preset (\S+)'))
            if ($t = Al ' -tune (\S+)') { $ffArg += @('-tune', $t) }
            if ($t = Al ' -profile:v (\S+)') { $ffArg += @('-profile:v', $t) }
            if ($t = Al ' -b:v (\S+)') { $ffArg += @('-b:v', $t) }
            $xp = Al ' -x264-params (\S+)'
            # Programin komutundaki x264 ayarlariyla (yalnizca seviye degisir) 2 kare kodlanir; x264 seviyeyi asan her
            # sinir icin "... > level limit" uyarisi yazar.
            function Dene($seviye) {
              $c = & ffmpeg -hide_banner -nostdin -i $src -map 0:v:0 -frames:v 2 -pix_fmt yuv420p -c:v libx264 @ffArg '-level:v' $seviye '-x264-params' $xp -f null - 2>&1 | ForEach-Object { "$_" }
              @($c | Where-Object { $_ -match 'level limit' } | ForEach-Object { ($_ -split '\] ', 2)[-1] })
            }
            $sonuc = 'OK'; $not = ''
            if (-not $sev -or -not $xp) { $sonuc = 'FARK'; $not = "komutta -level:v / -x264-params yok: $komut" }
            else {
              $u = Dene $sev
              if ($sev -ne $d.bek) { $sonuc = 'FARK'; $not += "beklenen $($d.bek) · " }
              if ($u.Count) { $sonuc = 'FARK'; $not += "x264 uyardi: $($u -join '; ')" } else { $not += "$sev ile uyari yok" }
              if ($d.alt) {
                $j = [array]::IndexOf($sira, $sev)
                if ($j -gt 0) {
                  $altSev = $sira[$j - 1]
                  $u2 = Dene $altSev
                  if ($u2.Count) { $not += " · $altSev ile: $(@($u2)[0])" } else { $sonuc = 'FARK'; $not += " · $altSev ile de uyari yok (gereksiz yukseltme)" }
                }
              }
            }
            if ($sonuc -ne 'OK') { $hatali++ }
            Write-Host "$sonuc  $i. $($d.ad): seviye $sev · $not"
            $satirlar += "| $i | $($d.ad) | $sev | $not | $sonuc |"
          }
          # x264, 2'den az B-karede B-piramidi kapatir (ayar penceresindeki not bunu soyler)
          foreach ($b in 1, 2) {
            $i++
            $o = Join-Path $PWD "piramit_$b.mp4"
            ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=352x288:rate=30 -frames:v 8 -c:v libx264 -preset medium -x264-params "bframes=$b" -y $o
            $sei = [regex]::Match([IO.File]::ReadAllText($o, [Text.Encoding]::ASCII), 'bframes=\d+ b_pyramid=\d+').Value
            $bek = if ($b -eq 1) { 'bframes=1 b_pyramid=0' } else { 'bframes=2 b_pyramid=2' }
            $sonuc = if ($sei -eq $bek) { 'OK' } else { 'FARK' }
            if ($sonuc -ne 'OK') { $hatali++ }
            Write-Host "$sonuc  $i. B-piramit, $b B-kare: $sei (beklenen $bek)"
            $satirlar += "| $i | B-piramit, $b B-kare (hiz ayari medium) | - | $sei (beklenen $bek) | $sonuc |"
          }
          $tablo = @("", "| # | x264 seviye denemesi | Programin seviyesi | x264 | Sonuc |", "|---|---|---|---|---|") + $satirlar
          "`n===== X264 SEVIYE ====="
          $tablo | ForEach-Object { $_ }
          $tablo | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($hatali) { "`n$hatali denemede sorun var."; exit 1 }
          "`nProgramin sectigi her seviyede x264 uyarmadi; yukseltilen her durumda bir alt seviye yetmiyor."
          exit 0
