name: FFmpeg dogrulama (Windows)

# FFmpeg derlemesi bitince kendiliginden calisir (ya da elle, run numarasiyla):
# 1) Linux'ta ozellikleri bilinen 15 deneme videosu uretilir (farkli bicim, boyut, kare hizi,
#    ses, dondurme bilgisi, renk araligi, HDR, Turkce dosya adi, yaninda ayni adli WAV...).
# 2) Windows'ta derlenen ffmpeg.exe ile programin kendi kodu (TikTok varsayilani) her birini cevirir.
#    Her cikti hedef meta veriyle (tools/hedef_kontrol.py) ve kaynakla
#    (tools/saglamlik_kontrol.py: sure, kare sayisi, senkron, dondurme, renk, kirpma) karsilastirilir.
#    Programin urettigi komut, XviD4PSP ile dogrulanan 0.3.0'in komutuyla harf harf karsilastirilir.
# 3) Diger ayarlar da denenir: YouTube varsayilani, 2 / 3 gecisli x264, WAV sesli MOV, siyah kenar,
#    sessiz, ses seviyesi / gecikme, HE-AAC, NVENC komutu (tools/ayar_kontrol.py).
on:
  workflow_run:
    workflows: ["Relios FFmpeg (win64, nonfree, en son kararli surumler)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Dogrulanacak FFmpeg derlemesinin run numarasi"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  kaynaklar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ffmpeg kur (yalnizca deneme videolarini uretmek icin)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -hide_banner -version | head -1

      - name: Deneme videolarini uret
        run: bash tools/test_kaynaklari.sh kaynaklar

      - name: Deneme videolarini yukle
        uses: actions/upload-artifact@v7
        with:
          name: deneme-videolari
          path: kaynaklar
          retention-days: 3

  dogrula:
    needs: kaynaklar
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: .NET 11 SDK (en son kararli)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'ga'

      - name: FFmpeg derlemesini indir
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: art

      - name: Deneme videolarini indir
        uses: actions/download-artifact@v8
        with:
          name: deneme-videolari
          path: kaynaklar

      - name: Ac
        run: |
          $zip = Get-ChildItem -Recurse art -Filter *.zip | Select-Object -First 1
          "Arsiv: $($zip.Name) ($([math]::Round($zip.Length / 1MB, 1)) MB)"
          Expand-Archive $zip.FullName -DestinationPath ff
          $bin = (Get-ChildItem -Recurse ff -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Get-ChildItem $bin | ForEach-Object { "{0,-14} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          "FFBIN=$bin" >> $env:GITHUB_ENV
          "$bin" >> $env:GITHUB_PATH

      - name: Surum ve icerik
        run: |
          ffmpeg -hide_banner -version
          "--- yapilandirma"
          ffmpeg -hide_banner -buildconf
          "--- kodlayicilar (beklenen: libx264, h264_nvenc, libfdk_aac, pcm_s16le/s24le/s32le/f32le; hevc_nvenc ve av1_nvenc OLMAMALI)"
          ffmpeg -hide_banner -encoders | Select-String -Pattern ' (libx264|h264_nvenc|hevc_nvenc|av1_nvenc|libfdk_aac|pcm_s16le|pcm_s24le|pcm_s32le|pcm_f32le|libx265|libsvtav1|libvpx-vp9|libmp3lame|libopus) '
          "--- cozuculer"
          ffmpeg -hide_banner -decoders | Select-String -Pattern ' (h264|hevc|av1|libdav1d|vp9|vp8|prores|vvc|dnxhd|mpeg2video|aac|mp3float|opus|flac|ac3|eac3|vorbis|alac|pcm_s16le|pcm_s24le|pcm_f32le) '
          "--- protokoller (ag protokolu olmamali)"
          ffmpeg -hide_banner -protocols

      - name: x264 surumu
        shell: cmd
        run: |
          ffmpeg -hide_banner -f lavfi -i testsrc2=size=64x64:rate=1 -frames:v 1 -c:v libx264 -flags +global_header -f null - 2>&1 | findstr /C:"core"
          exit /b 0

      - name: Programin kodlama kodunu derle
        run: |
          dotnet build tools/ReliosExport.Smoke -c Release -o smoke --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory smoke/ffmpeg -Force | Out-Null
          Copy-Item "$env:FFBIN/ffmpeg.exe","$env:FFBIN/ffprobe.exe" smoke/ffmpeg/
          # Karsilastirma icin 0.3.0'in (ayar menusunden onceki, dogrulanmis) TikTok komut ureticisi
          dotnet build tools/ReliosExport.EskiKomut -c Release -o eski --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Birim kontrol (H.264 seviye hesabi, NVENC komutu, veri klasoru)
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          & ./smoke/ReliosExport.Smoke.exe --birim-kontrol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tum deneme videolari (programin kendi TikTok kodu + kontroller)
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $kok = (Resolve-Path kaynaklar).Path
          $man = Get-Content (Join-Path $kok manifest.json) -Raw -Encoding utf8 | ConvertFrom-Json
          $satirlar = @()
          $farklar = @()
          $hatali = 0
          $i = 0
          foreach ($k in $man) {
            $i++
            $src = Join-Path $kok $k.dosya
            if ($k.windows_adi) {
              $yeni = Join-Path $kok $k.windows_adi
              Copy-Item -LiteralPath $src -Destination $yeni -Force
              $src = $yeni
            }
            $dir = Join-Path $PWD "cikti/$i"
            Write-Host "::group::$i. $([IO.Path]::GetFileName($src)) - $($k.aciklama)"
            # Dikey 9:16 hazir ayari (x264, 1216x2160, 29,97 fps): XviD4PSP hedefiyle dogrulanan ayar
            $log = & ./smoke/ReliosExport.Smoke.exe $src $dir --profil tiktok-916 2>&1 | ForEach-Object { "$_" }
            $rc = $LASTEXITCODE
            $log | ForEach-Object { Write-Host $_ }
            $bilgi = (($log | Where-Object { $_ -like "Kaynak: *" } | Select-Object -First 1) -replace '^Kaynak: ', '')
            $hedef = "-"; $sag = "-"; $durum = "HATA (kodlama)"; $komut = "-"; $komutFarki = $false
            # Yeni programin komutu 0.3.0'inkiyle ayni mi (ayni adli ses dosyasi olan denemeler haric)
            if ($k.eski_komut -ne $false) {
              $yeniKomut = (($log | Where-Object { $_ -like "Komut 1/1: *" } | Select-Object -First 1) -replace '^Komut 1/1: ', '')
              $eskiKomut = (& ./eski/ReliosExport.EskiKomut.exe "$env:FFBIN/ffprobe.exe" $src 2>&1 | ForEach-Object { "$_" } | Select-Object -Last 1)
              # Bilincli farklar: x264 is parcacigi 7 -> 8 (islemcinin 8 cekirdegi); mono ses stereoya tam seviyede (pan)
              $normal = $yeniKomut -creplace ':threads=8:', ':threads=7:' -creplace 'x264-params threads=8:', 'x264-params threads=7:'
              $monoNot = ''
              if ($normal -cmatch 'pan=stereo\|c0=c0\|c1=c0,') { $normal = $normal -creplace 'pan=stereo\|c0=c0\|c1=c0,', ''; $monoNot = ', mono ses iki kanala tam seviyede' }
              if ($normal -ceq $eskiKomut) { $komut = "aynı (iş parçacığı 8$monoNot)" } else {
                $komut = "FARK"; $komutFarki = $true
                Write-Host "0.3.0 komutu: $eskiKomut"
                Write-Host "Yeni komut  : $yeniKomut"
                $farklar += "  $i. komut 0.3.0'dan farkli"
              }
            }
            if ($rc -eq 0) {
              $mp4 = (Get-ChildItem -LiteralPath $dir -Filter *.mp4 | Select-Object -First 1).FullName
              $h = & python -X utf8 -I tools/hedef_kontrol.py $mp4 8 2>&1 | ForEach-Object { "$_" }
              $hrc = $LASTEXITCODE
              $h | ForEach-Object { Write-Host $_ }
              $s = & python -X utf8 -I tools/saglamlik_kontrol.py $src $mp4 $k.matris $k.aralik ([int][bool]$k.ses) 2>&1 | ForEach-Object { "$_" }
              $src_rc = $LASTEXITCODE
              $s | ForEach-Object { Write-Host $_ }
              $hedef = ((($h | Where-Object { $_ -match '\d+ kontrol, \d+ fark' }) | Select-Object -Last 1) -replace '^.*?(\d+ kontrol, \d+ fark).*$', '$1')
              $sag = ((($s | Where-Object { $_ -match '\d+ kontrol, \d+ fark' }) | Select-Object -Last 1) -replace '^.*?(\d+ kontrol, \d+ fark).*$', '$1')
              $erc = 0
              if ($k.ek) {
                $e = & python -X utf8 -I tools/ayar_kontrol.py $mp4 @($k.ek -split ' ') 2>&1 | ForEach-Object { "$_" }
                $erc = $LASTEXITCODE
                $e | ForEach-Object { Write-Host $_ }
                $s += $e
              }
              $farklar += ($h + $s) | Where-Object { $_ -like "FARK*" } | ForEach-Object { "  $i. $_" }
              if ($hrc -eq 0 -and $src_rc -eq 0 -and $erc -eq 0 -and -not $komutFarki) { $durum = "OK" } else { $durum = "FARK"; $hatali++ }
            } else {
              $hatali++
              $farklar += "  $i. kodlama basarisiz (kod $rc)"
            }
            Write-Host "::endgroup::"
            $satirlar += "| $i | $($k.aciklama) | $bilgi | $komut | $hedef | $sag | $durum |"
          }
          $tablo = @("| # | Deneme videosu | Programin okudugu | 0.3.0 komutu | Hedef meta veri | Saglamlik | Sonuc |", "|---|---|---|---|---|---|---|") + $satirlar
          "`n===== OZET ====="
          $tablo | ForEach-Object { $_ }
          if ($farklar.Count) { "`nFarklar:"; $farklar | ForEach-Object { $_ } }
          $tablo | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($hatali) { "`n$hatali deneme videosunda sorun var."; exit 1 }
          "`nTum deneme videolari temiz."

      - name: Diger ayarlar (YouTube, 2 / 3 gecis, WAV + MOV, siyah kenar, ses, NVENC komutu)
        if: always()
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $kok = (Resolve-Path kaynaklar).Path
          $man = Get-Content (Join-Path $kok manifest.json) -Raw -Encoding utf8 | ConvertFrom-Json
          function Kaynak($ad) { $man | Where-Object { $_.dosya -like "$ad*" } | Select-Object -First 1 }
          $yt = @('--profil', 'youtube')
          $testler = @(
            @{ ad = 'YouTube varsayilani: 1080p60 yatay H.264 (XviD4PSP ayarlari; boyut, fps, profil, seviye kaynak)'; k = '01_'; arg = $yt; sag = @('--boyut', 'kaynak', '--fps', 'kaynak')
               hedef = @('--boyut', '1920x1080', '--fps', '60/1', '--gop', '100/51', '--kap', 'mov'); ayar = @('kap=mov') },
            @{ ad = 'YouTube varsayilani: telefon (dondurulmus HEVC 10 bit)'; k = '03_'; arg = $yt; sag = @('--boyut', 'kaynak', '--fps', 'kaynak')
               hedef = @('--boyut', '1080x1920', '--fps', '30/1', '--gop', '50/26', '--kap', 'mov'); ayar = @('kap=mov') },
            @{ ad = 'YouTube varsayilani: 1080x2400 uzun dikey'; k = '13_'; arg = $yt; sag = @('--boyut', 'kaynak', '--fps', 'kaynak')
               hedef = @('--boyut', '1080x2400', '--fps', '30/1', '--gop', '50/26', '--kap', 'mov'); ayar = @('kap=mov') },
            @{ ad = 'YouTube varsayilani: 32 bit float WAV sesli 4K50 ProRes'; k = '06_'; arg = $yt; sag = @('--boyut', 'kaynak', '--fps', 'kaynak')
               hedef = @('--boyut', '3840x2160', '--fps', '50/1', '--gop', '83/42', '--kap', 'mov'); ayar = @('kap=mov') },
            @{ ad = 'x264 2 gecis 4000 kb/s'; k = '12_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Video.X264.Mod=IkiGecis', '--ayarla', 'Video.X264.BitHizi=4000'); sag = @()
               ayar = @('x264:rc=2pass', 'x264:bitrate=4000', 'vbit=4000000±30%') },
            @{ ad = 'x264 3 gecis 4000 kb/s'; k = '12_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Video.X264.Mod=UcGecis', '--ayarla', 'Video.X264.BitHizi=4000'); sag = @()
               ayar = @('x264:rc=2pass', 'x264:bitrate=4000', 'vbit=4000000±30%') },
            @{ ad = 'WAV ses (MOV kabi, 24 bit)'; k = '02_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Ses.Kodlayici=Wav'); sag = @()
               ayar = @('kap=mov', 'acodec=pcm_s24le', 'ar=48000', 'ac=2') },
            @{ ad = 'Oran farkliysa siyah kenar (21:9 -> 9:16)'; k = '12_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Video.Oran=KenarEkle'); sag = @('--oran', 'kenar')
               ayar = @('boyut=1216x2160') },
            @{ ad = 'Ses kaynagi: sessiz'; k = '10_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Ses.Kaynak=Sessiz'); sag = @(); ses = 0
               ayar = @('ses=yok') },
            @{ ad = 'Ses kaynagi: videonun sesi (yaninda WAV olsa da)'; k = '14_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Ses.Kaynak=VideonunSesi'); sag = @()
               ayar = @('ses_seviye=-12.1±2.5') },
            @{ ad = 'Ayni adli WAV + ses seviyesi -6 dB + 250 ms gecikme'; k = '15_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Ses.Seviye=-6', '--ayarla', 'Ses.Gecikme=250'); sag = @()
               ayar = @('ses_seviye=-42.8±2.5') },
            @{ ad = 'FDK HE-AAC 48 kb/s (Turkce adli kaynak)'; k = '08_'; arg = @('--profil', 'tiktok-916', '--ayarla', 'Ses.Fdk.Profil=aac_he', '--ayarla', 'Ses.Fdk.BitHizi=48'); sag = @()
               ayar = @('acodec=aac', 'aprofil=HE-AAC', 'abit=48000±10%') },
            @{ ad = 'TikTok varsayilani komutu: H.264 High@4.2 60 fps kaynak (NVENC CBR 34375, kart yok: yalnizca komut)'; k = '01_'; arg = @('--sadece-komut'); komut = @(
                 '-vf scale=trunc(iw*sar/2)*2:trunc(ih/2)*2:flags=lanczos', '-c:v h264_nvenc -preset p7 -tune hq -profile:v high -level:v 4.2 -rc cbr -b:v 34375k -bufsize 55000k',
                 '-bf 0 -refs 3 -dpb_size 3', '-coder cabac -g 30 -no-scenecut 1', '-c:a libfdk_aac -profile:a aac_low -b:a 128k -ar 48000 -ac 2'); yok = @('crop=', 'fps=', '-b_ref_mode') },
            @{ ad = 'TikTok varsayilani komutu: HEVC 10 bit telefon kaynak (Main, seviye otomatik)'; k = '03_'; arg = @('--sadece-komut'); komut = @(
                 '-c:v h264_nvenc -preset p7 -tune hq -profile:v main -rc cbr -b:v 34375k -bufsize 55000k', '-bf 0 -refs 3 -dpb_size 3', '-g 30'); yok = @('-level:v', 'crop=', 'fps=') },
            @{ ad = 'TikTok varsayilani komutu: High@3.2 kare kaynak (34375 kb/s 3.2 sinirini asar, NVENC reddederdi: seviye 4.1)'; k = '07_'; arg = @('--sadece-komut'); komut = @(
                 '-c:v h264_nvenc -preset p7 -tune hq -profile:v high -level:v 4.1 -rc cbr -b:v 34375k -bufsize 55000k'); yok = @('-level:v 3.2') },
            @{ ad = 'Hata mesaji: TikTok varsayilani (NVENC) kart yokken (Turkce aciklama + gunluk dosyasi)'; k = '07_'; arg = @(); hata = 'NVENC kullanılamadı' }
          )
          $satirlar = @(); $hatali = 0; $i = 0
          foreach ($t in $testler) {
            $i++
            $k = Kaynak $t.k
            $src = Join-Path $kok $k.dosya
            if ($k.windows_adi) {
              $yeni = Join-Path $kok $k.windows_adi
              Copy-Item -LiteralPath $src -Destination $yeni -Force
              $src = $yeni
            }
            $dir = Join-Path $PWD "diger/$i"
            Write-Host "::group::$i. $($t.ad)"
            $log = & ./smoke/ReliosExport.Smoke.exe $src $dir @($t.arg) 2>&1 | ForEach-Object { "$_" }
            $rc = $LASTEXITCODE
            $log | ForEach-Object { Write-Host $_ }
            $sonuc = "OK"; $ozet = ""
            if ($t.hata) {
              # Bilerek basarisiz olan deneme: Turkce aciklama ve gunluk dosyasi olmali
              $mesaj = ($log | Where-Object { $_ -like "HATA: *" } | Select-Object -First 1)
              $gunluk = (($log | Where-Object { $_ -like "Günlük: *" } | Select-Object -First 1) -replace '^Günlük: ', '')
              if ($rc -eq 5 -and $mesaj -and $mesaj.Contains($t.hata) -and $gunluk -and (Test-Path -LiteralPath $gunluk)) {
                $ozet = "$mesaj · günlük $([math]::Round((Get-Item -LiteralPath $gunluk).Length / 1KB, 1)) KB"
                Write-Host "--- gunluk dosyasinin basi:"
                Get-Content -LiteralPath $gunluk -TotalCount 12 | ForEach-Object { Write-Host $_ }
              } else { $sonuc = "FARK"; $ozet = "beklenen hata yok (kod $rc): $mesaj" }
            }
            elseif ($rc -ne 0) { $sonuc = "HATA (kod $rc)" }
            elseif ($t.komut) {
              $satir = ($log | Where-Object { $_ -like "Komut 1/1: *" } | Select-Object -First 1)
              $eksik = @($t.komut | Where-Object { -not $satir.Contains($_) })
              $fazla = @($t.yok | Where-Object { $_ -and $satir.Contains($_) })
              if ($eksik.Count -or $fazla.Count) { $sonuc = "FARK"; $ozet = "komutta yok: " + ($eksik -join ' | ') + " · olmamali: " + ($fazla -join ' | ') }
              else { $ozet = "$($t.komut.Count) parça komutta var, $(@($t.yok).Count) parça yok" }
            } else {
              $out = (Get-ChildItem -LiteralPath $dir | Where-Object { $_.Extension -in '.mp4', '.mov' } | Select-Object -First 1).FullName
              $ses = if ($null -ne $t.ses) { $t.ses } else { [int][bool]$k.ses }
              $s = & python -X utf8 -I tools/saglamlik_kontrol.py $src $out $k.matris $k.aralik $ses @($t.sag) 2>&1 | ForEach-Object { "$_" }
              $src_rc = $LASTEXITCODE
              $a = & python -X utf8 -I tools/ayar_kontrol.py $out @($t.ayar) 2>&1 | ForEach-Object { "$_" }
              $arc = $LASTEXITCODE
              if ($t.hedef) {
                # Kaynakla ayni boyut / fps disinda her sey XviD4PSP hedefiyle ayni mi
                $hd = & python -X utf8 -I tools/hedef_kontrol.py $out 8 @($t.hedef) '--profil' 'kaynak' '--kaynak' $src 2>&1 | ForEach-Object { "$_" }
                if ($LASTEXITCODE -ne 0) { $arc = 1 }
                $a += $hd
              }
              ($s + $a) | ForEach-Object { Write-Host $_ }
              $ozet = ((($s + $a) | Where-Object { $_ -match '\d+ kontrol, \d+ fark' }) -replace '^(.*?): (\d+ kontrol, \d+ fark).*$', '$1 $2') -join ' · '
              if ($src_rc -ne 0 -or $arc -ne 0) { $sonuc = "FARK"; $ozet += " · " + ((($s + $a) | Where-Object { $_ -like "FARK*" }) -join ' | ') }
            }
            if ($sonuc -ne "OK") { $hatali++ }
            Write-Host "::endgroup::"
            $satirlar += "| $i | $($t.ad) | $ozet | $sonuc |"
          }
          $tablo = @("", "| # | Ayar denemesi | Kontroller | Sonuc |", "|---|---|---|---|") + $satirlar
          "`n===== DIGER AYARLAR ====="
          $tablo | ForEach-Object { $_ }
          $tablo | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($hatali) { "`n$hatali ayar denemesinde sorun var."; exit 1 }
          "`nTum ayar denemeleri temiz."
          exit 0  # son deneme bilerek hata koduyla biter; adimin sonucunu o belirlemesin
